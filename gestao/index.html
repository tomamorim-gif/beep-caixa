<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beep · Gestão</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0e;--p1:#131418;--p2:#1a1c21;--p3:#23262d;--line:#2a2d35;--ink:#f3f4f6;--mu:#9aa0ab;--y:#ffd60a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#38bdf8;--r:16px}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--p3);border:1px solid var(--line);transition:background .15s,border-color .15s}
.btn:hover{border-color:#3a3e48}.btn.pri{background:var(--y);color:#111;border-color:var(--y)}.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dang{color:#fca5a5}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--p2);outline:none;width:100%}
input:focus,select:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,10,.15)}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mu);font-weight:500}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--p3);color:var(--mu);white-space:nowrap}
.pill.ok{background:rgba(34,197,94,.12);color:#4ade80}.pill.warn{background:rgba(245,158,11,.13);color:#fbbf24}.pill.bad{background:rgba(239,68,68,.13);color:#f87171}.pill.new{background:rgba(56,189,248,.13);color:#7dd3fc}
.mu{color:var(--mu)}.sm{font-size:13px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(420px,100%);padding:32px;display:grid;gap:16px}
.login img{height:44px;width:auto}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--p2);border-radius:12px;padding:4px}
.tabs2 button{min-height:38px;border-radius:9px;font-weight:600;color:var(--mu)}.tabs2 button.on{background:var(--p3);color:var(--ink)}
.erro{color:#f87171;font-size:13px;min-height:18px}
/* app */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side img{height:36px;width:auto;margin:0 8px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600;text-align:left}
.nav:hover{background:var(--p2);color:var(--ink)}.nav.on{background:var(--p2);color:var(--ink);box-shadow:inset 3px 0 0 var(--y)}
.nav svg{flex:none}
.side .quem{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mu)}
main{padding:28px 32px 80px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:30px}.head p{color:var(--mu);margin-top:4px}
.drop{border:2px dashed #3a3e48;border-radius:20px;padding:48px 24px;text-align:center;display:grid;gap:10px;place-items:center;background:var(--p1);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--y);background:rgba(255,214,10,.05)}
.drop .ic{width:64px;height:64px;border-radius:18px;background:rgba(255,214,10,.1);color:var(--y);display:grid;place-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi span{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font:800 22px Manrope,Inter,sans-serif;margin-top:4px}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:var(--p1)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}.tbl .n{text-align:right}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--p1)}
.inp-s{min-height:34px!important;padding:0 8px!important;width:92px!important;text-align:right}
.stack{display:grid;gap:4px}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:#fde68a;font-size:14px}
.aviso.info{background:rgba(56,189,248,.07);border-color:rgba(56,189,248,.25);color:#bae6fd}
.barra{position:sticky;bottom:0;margin-top:18px;background:rgba(11,12,14,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:13px;cursor:pointer}.chk input{accent-color:var(--y)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:50}.modal.on{display:grid}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;padding:26px}
.modal.wide .card{width:min(980px,100%)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#111;padding:12px 18px;border-radius:12px;font-weight:600;transition:.2s;z-index:60;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{border-top:3px solid var(--c,#22c55e)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--p2);cursor:pointer}
.opt:has(input:checked){border-color:var(--y);background:rgba(255,214,10,.05)}.opt input{accent-color:var(--y);margin-top:4px}
.opt b{display:block}.opt small{color:var(--mu)}
.vazio{padding:28px;text-align:center;color:var(--mu)}
@media print{.side,.head .row,.barra{display:none!important}.app{display:block}body,html{background:#fff;color:#000}.tblwrap,.kpi,.card{background:#fff;border-color:#ccc}.tbl th{background:#fff;color:#333}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow:auto;padding:12px}.side img,.side .quem{display:none}main{padding:20px 16px 80px}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>

<script type="module">

const SB_URL='https://gdnvjpmpfgautrmtkjmx.supabase.co', SB_KEY='sb_publishable_z-GGao9BiSTEUgMi1xAHCQ_5Vh5e3FY';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=v=>(v>0?'+':'')+(v*100).toFixed(1).replace('.',',')+'%';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)};

const bonito=n=>String(n||'').toLowerCase().replace(/(^|[\s\-(\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(\d+)\s?(ml|g|kg|l|un)\b/gi,(m,a,b)=>a+b.toLowerCase());
const ICON={nf:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
 pf:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 cfg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 up:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>'};

// ---------- estado ----------
const S={user:null,emp:null,papel:null,locais:[],produtos:[],codigos:[],codForn:[],precos:[],portfolios:[],pitens:[],tela:'vend',nota:null,linhas:[],destino:null,pfNovos:new Set()};
const lojas=()=>S.locais.filter(l=>l.tipo==='loja'&&l.ativo);
const regra=()=>S.emp?.regra_preco||{divisor:.57,terminacaoCentavos:90};
function precoSugerido(custo){const r=regra(),bruto=Math.ceil(custo/r.divisor),reais=Math.floor(bruto/100);let c=reais*100+r.terminacaoCentavos;if(c<bruto)c+=100;return c}
const margem=(p,c)=>p>0?(p-c)/p:0;
function precoRef(pid){const ps=S.precos.filter(p=>p.produto_id===pid);return ps.length?Math.max(...ps.map(p=>p.preco)):null}

// ---------- login ----------
function telaLogin(modo='entrar',msg=''){
 $('#raiz').innerHTML=`<div class="login"><div class="card">
  <img src="../logo.png" alt="Beep Smart Mercadinhos">
  <div><h1 style="font-size:24px">Gestão da loja</h1><p class="mu sm">Entrada de notas, portfólios e configurações.</p></div>
  <div class="tabs2"><button class="${modo==='entrar'?'on':''}" data-m="entrar">Entrar</button><button class="${modo==='convite'?'on':''}" data-m="convite">Tenho um convite</button></div>
  <form id="fLogin" style="display:grid;gap:12px">
   ${modo==='convite'?`<label class="f">Código do convite<input type="text" name="codigo" placeholder="XXXX-XXXX" autocomplete="off" required style="text-transform:uppercase;letter-spacing:.12em"></label>`:''}
   <label class="f">E-mail<input type="email" name="email" autocomplete="username" required></label>
   <label class="f">${modo==='convite'?'Crie uma senha (mínimo 8 caracteres)':'Senha'}<input type="password" name="senha" autocomplete="${modo==='convite'?'new-password':'current-password'}" minlength="${modo==='convite'?8:1}" required></label>
   <p class="erro" id="lErro">${esc(msg)}</p>
   <button class="btn pri" type="submit">${modo==='convite'?'Criar meu acesso':'Entrar'}</button>
  </form></div></div>`;
 document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>telaLogin(b.dataset.m));
 $('#fLogin').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),bt=e.target.querySelector('button');bt.disabled=true;$('#lErro').textContent='';
  try{const email=String(f.get('email')).trim(),senha=String(f.get('senha'));
   if(modo==='convite'){const r=await fetch(SB_URL+'/functions/v1/gestao',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({acao:'aceitar_convite',codigo:f.get('codigo'),email,senha})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Não foi possível criar o acesso')}
   const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw new Error(error.message.includes('Invalid')?'E-mail ou senha incorretos':error.message);
   await iniciar()}catch(err){$('#lErro').textContent=err.message;bt.disabled=false}};
}

// ---------- carga ----------
async function carregar(){const e=S.emp.id;
 const q=(t,sel='*')=>sb.from(t).select(sel).eq('empresa_id',e);
 const [lc,pr,cd,cf,pc,pf,pi]=await Promise.all([q('locais','id,nome,tipo,ativo,portfolio_id,app_consulta,app_compra,app_pendente'),q('produtos','id,ean,nome,ncm,cest,unidade,custo,ativo').order('nome'),q('produto_codigos','produto_id,ean'),q('produto_codigos_fornecedor','produto_id,fornecedor_cnpj,codigo,fator'),q('precos_local','produto_id,local_id,preco,ativo_no_mix,estoque_min,estoque_max'),q('portfolios','id,nome,descricao,cor').order('criado_em'),q('portfolio_itens','portfolio_id,produto_id,estoque_min,estoque_max')]);
 for(const r of [lc,pr,cd,cf,pc,pf,pi])if(r.error)throw r.error;
 S.locais=lc.data;S.produtos=pr.data;S.codigos=cd.data;S.codForn=cf.data;S.precos=pc.data;S.portfolios=pf.data;S.pitens=pi.data}
async function iniciar(){const {data:{session}}=await sb.auth.getSession();if(!session){telaLogin();return}S.user=session.user;
 const {data:m}=await sb.from('membros').select('empresa_id,papel').eq('user_id',S.user.id).eq('ativo',true).in('papel',['dono','gerente']).limit(1);
 if(!m?.length){await sb.auth.signOut();telaLogin('entrar','Este login não tem acesso de dono ou gerente.');return}
 S.papel=m[0].papel;const {data:emp}=await sb.from('empresas').select('id,nome_exibicao,razao_social,cnpj,regra_preco,gravacao,dias_video').eq('id',m[0].empresa_id).single();S.emp=emp;
 try{await carregar()}catch(e){$('#raiz').innerHTML=`<div class="login"><div class="card"><h2>Não foi possível carregar</h2><p class="mu">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div></div>`;return}
 shell()}
function shell(){$('#raiz').innerHTML=`<div class="app"><aside class="side"><img src="../logo.png" alt="Beep">
  <button class="nav" data-t="vend"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Vendas</button>
  <button class="nav" data-t="est"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Estoque e reposição</button>
  <button class="nav" data-t="nf">${ICON.nf}Entrada de NF-e</button><button class="nav" data-t="pf">${ICON.pf}Portfólios</button>
  <button class="nav" data-t="cx"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>Caixas</button>
  <button class="nav" data-t="app"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>App do cliente</button>
  <button class="nav" data-t="vid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>Vídeos</button>
  <button class="nav" data-t="cfg">${ICON.cfg}Configurações</button>
  <div class="quem"><b style="color:var(--ink)">${esc(S.emp.nome_exibicao||S.emp.razao_social)}</b><br>${esc(S.user.email)} · ${S.papel==='dono'?'Dono':'Gerente'}<br><button class="btn sm" id="sair" style="margin-top:10px">Sair</button></div></aside><main id="main"></main></div>`;
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.tela=b.dataset.t;render()});$('#sair').onclick=async()=>{await sb.auth.signOut();location.reload()};render()}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tela));({vend:telaVend,est:telaEst,nf:telaNF,pf:telaPF,cx:telaCx,app:telaApp,vid:telaVid,cfg:telaCfg})[S.tela]()}

// ---------- leitura do XML (NF-e modelo 55) ----------
const tx=(el,sel)=>{if(!el)return '';const n=el.getElementsByTagName(sel)[0];return n?n.textContent.trim():''};
const nr=v=>{const n=parseFloat(String(v||'0'));return Number.isFinite(n)?n:0};
const centavos=r=>Math.round(r*100);
const eanOk=v=>/^\d{8,14}$/.test(v)?v:null;
function lerNFe(xml){if(xml.length>5e6)throw new Error('Arquivo grande demais');
 const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('O arquivo não é um XML válido');
 const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não encontrei a NF-e dentro do arquivo. Use o XML da nota (não o PDF/DANFE).');
 const chave=(inf.getAttribute('Id')||'').replace(/^NFe/,'');if(!/^\d{44}$/.test(chave))throw new Error('Chave de acesso inválida no XML');
 const mod=tx(inf.getElementsByTagName('ide')[0],'mod');if(mod&&mod!=='55')throw new Error('Esta é uma nota modelo '+mod+'. Para entrada de mercadoria use a NF-e modelo 55.');
 const emit=inf.getElementsByTagName('emit')[0],dest=inf.getElementsByTagName('dest')[0],ide=inf.getElementsByTagName('ide')[0];
 const itens=[...inf.getElementsByTagName('det')].map(det=>{const p=det.getElementsByTagName('prod')[0],imp=det.getElementsByTagName('imposto')[0];
  const qCom=nr(tx(p,'qCom')),qTrib=nr(tx(p,'qTrib'))||qCom,fator=qCom>0?Math.max(1,Math.round(qTrib/qCom*1000)/1000):1;
  let impostos=0;if(imp){const ipi=imp.getElementsByTagName('IPI')[0];if(ipi)impostos+=nr(tx(ipi,'vIPI'));for(const st of imp.getElementsByTagName('vICMSST'))impostos+=nr(st.textContent)}
  const total=nr(tx(p,'vProd'))-nr(tx(p,'vDesc'))+nr(tx(p,'vFrete'))+nr(tx(p,'vSeg'))+nr(tx(p,'vOutro'))+impostos,ct=centavos(total),un=qCom*fator;
  return {nItem:+det.getAttribute('nItem'),codigo:tx(p,'cProd'),ean:eanOk(tx(p,'cEAN')),eanUn:eanOk(tx(p,'cEANTrib')),desc:tx(p,'xProd'),ncm:tx(p,'NCM'),cest:tx(p,'CEST')||null,uCom:tx(p,'uCom'),qCom,fator,custoTotal:ct,custoUn:un>0?Math.round(ct/un):ct}});
 return {chave,numero:tx(ide,'nNF'),serie:tx(ide,'serie'),emissao:tx(ide,'dhEmi')||tx(ide,'dEmi'),fornCnpj:tx(emit,'CNPJ')||tx(emit,'CPF'),fornNome:tx(emit,'xNome'),destCnpj:tx(dest,'CNPJ'),total:centavos(nr(tx(inf.getElementsByTagName('ICMSTot')[0],'vNF'))),itens,xml}}

// casa cada item com o cadastro: primeiro pelo código do fornecedor, depois pelo código de barras

 return n.itens.map(it=>{let p=null,por=null;const cf=S.codForn.find(c=>c.fornecedor_cnpj===n.fornCnpj&&c.codigo===it.codigo);
  if(cf){p=S.produtos.find(x=>x.id===cf.produto_id);por='codigo';if(cf.fator&&+cf.fator!==1&&it.fator===1){it.fator=+cf.fator;it.custoUn=Math.round(it.custoTotal/(it.qCom*it.fator))}}

 M.innerHTML=`<div class="head"><div><h1>Vídeos de segurança</h1><p>Gravações da câmera do caixa. Ficam guardadas por ${S.emp.dias_video||3} dias e depois são apagadas.</p></div><div class="row"><select id="fLoja" style="width:220px"><option value="">Todas as lojas</option>${lojas().map(l=>`<option value="${l.id}" ${VID.loja===l.id?'selected':''}>${esc(l.nome)}</option>`).join('')}</select><select id="fMot" style="width:200px"><option value="">Todos os motivos</option>${Object.entries(MOTIVO).map(([k,v])=>`<option value="${k}" ${VID.motivo===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div id="vidCorpo"><p class="vazio">Carregando…</p></div>`;
 $('#fLoja').onchange=e=>{VID.loja=e.target.value;telaVid()};$('#fMot').onchange=e=>{VID.motivo=e.target.value;telaVid()};
 let q=sb.from('videos_seguranca').select('id,local_id,path,motivo,inicio,fim,bytes,venda_id').eq('empresa_id',S.emp.id).eq('enviado',true).order('inicio',{ascending:false}).limit(200);if(VID.loja)q=q.eq('local_id',VID.loja);if(VID.motivo)q=q.eq('motivo',VID.motivo);
 const {data,error}=await q;const C=$('#vidCorpo');if(!C)return;if(error){C.innerHTML=`<p class="vazio">${esc(error.message)}</p>`;return}
 const nome=id=>S.locais.find(l=>l.id===id)?.nome||'—',dur=v=>{const s=Math.max(0,Math.round((new Date(v.fim)-new Date(v.inicio))/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 C.innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Quando</th><th>Loja</th><th>Motivo</th><th class="n">Duração</th><th class="n">Tamanho</th><th></th></tr></thead><tbody>${data.map(v=>`<tr><td class="num">${new Date(v.inicio).toLocaleString('pt-BR')}</td><td>${esc(nome(v.local_id))}</td><td><span class="pill ${v.motivo==='paga'?'ok':'warn'}">${esc(MOTIVO[v.motivo]||v.motivo)}</span></td><td class="n num">${dur(v)}</td><td class="n num mu">${v.bytes?(v.bytes/1048576).toFixed(1).replace('.',',')+' MB':'—'}</td><td class="n"><button class="btn sm pri" data-ver="${v.id}">Assistir</button></td></tr>`).join('')||'<tr><td colspan="6" class="vazio">Nenhum vídeo no período guardado.</td></tr>'}</tbody></table></div>`;
 C.querySelectorAll('[data-ver]').forEach(b=>b.onclick=async()=>{const v=data.find(x=>x.id===b.dataset.ver);const {data:u,error:e}=await sb.storage.from('seguranca').createSignedUrl(v.path,600);if(e)return toast('Não foi possível abrir o vídeo: '+e.message);
  $('#modal').classList.add('wide');modal(`<h2>${esc(nome(v.local_id))} · ${new Date(v.inicio).toLocaleString('pt-BR')}</h2><video src="${esc(u.signedUrl)}" controls autoplay playsinline style="width:100%;max-height:70vh;border-radius:12px;background:#000"></video><div class="row"><span class="pill warn">${esc(MOTIVO[v.motivo]||v.motivo)}</span><span class="sp"></span><a class="btn" href="${esc(u.signedUrl)}" download>Baixar</a><button class="btn pri" data-close>Fechar</button></div>`)})}

// ---------- tela: app do cliente ----------
const LINK_CLI=id=>`https://tomamorim-gif.github.io/beep-caixa/cliente/#l=${id}`;
let APP={loja:''};
async function qrSvg(txt,cell=6){try{const {default:Q}=await import('https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/+esm');const q=Q(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:cell,margin:2,scalable:true})}catch(e){return ''}}
async function telaApp(){const M=$('#main'),dono=S.papel==='dono';
 M.innerHTML=`<div class="head"><div><h1>App do cliente</h1><p>O morador instala pelo QR da loja. Você escolhe o que cada loja libera e pode liberar a compra para clientes de confiança.</p></div></div>
  <div class="pgrid">${lojas().map(l=>`<div class="card" style="display:grid;gap:12px"><div class="row"><h3 style="font-size:18px">${esc(l.nome)}</h3><span class="sp"></span><button class="btn sm" data-qr="${l.id}">QR da loja</button></div>
   ${[['app_consulta','1. Consulta','Vê produtos, preços e estoque'],['app_compra','2. Compra no celular','Paga com Pix ou cartão no app'],['app_pendente','3. Vendas travadas','Paga só as compras que você registrar']].map(([k,t,d])=>`<label class="opt" style="padding:12px"><input type="checkbox" data-loja="${l.id}" data-op="${k}" ${l[k]?'checked':''} ${dono?'':'disabled'}><span><b>${t}</b><small>${d}</small></span></label>`).join('')}</div>`).join('')}</div>
  <div class="head" style="margin:30px 0 12px"><div><h2 style="font-size:20px">Clientes cadastrados</h2><p>Liberar a compra aqui vale só para aquele cliente, mesmo que a loja não libere.</p></div><select id="aLoja" style="width:240px"><option value="">Todas as lojas</option>${lojas().map(l=>`<option value="${l.id}" ${APP.loja===l.id?'selected':''}>${esc(l.nome)}</option>`).join('')}</select></div>
  <div id="aCli" class="tblwrap"><p class="vazio">Carregando…</p></div>
  <h2 style="font-size:20px;margin:30px 0 12px">Vendas travadas aguardando pagamento</h2><div id="aPend" class="tblwrap"><p class="vazio">Carregando…</p></div>`;
 M.querySelectorAll('[data-op]').forEach(c=>c.onchange=async()=>{const r=await sb.from('locais').update({[c.dataset.op]:c.checked}).eq('id',c.dataset.loja).select('id');if(r.error||!r.data?.length){c.checked=!c.checked;return toast('Não foi possível salvar'+(r.error?': '+r.error.message:''))}const l=S.locais.find(x=>x.id===c.dataset.loja);l[c.dataset.op]=c.checked;toast('Salvo. O app do cliente já segue a nova regra.')});
 M.querySelectorAll('[data-qr]').forEach(b=>b.onclick=async()=>{const l=S.locais.find(x=>x.id===b.dataset.qr),link=LINK_CLI(l.id),svg=await qrSvg(link,8);$('#modal').classList.add('wide');
  modal(`<div id="cartaz" style="display:grid;gap:14px;justify-items:center;text-align:center"><img src="../logo.png" alt="Beep" style="height:46px"><h2 style="font-size:26px">Compre e consulte pelo celular</h2><p class="mu" style="max-width:440px">Leia o QR com a câmera, crie seu acesso com CPF e uma senha de 4 números e veja os produtos, preços e o que tem no estoque da loja ${esc(l.nome)}.</p>${svg?`<div style="background:#fff;border-radius:18px;padding:14px;width:280px">${svg}</div>`:''}</div>
   <div class="row"><input type="text" value="${esc(link)}" readonly><button class="btn" id="cpy2">Copiar link</button><button class="btn" onclick="window.print()">Imprimir cartaz</button><button class="btn pri" data-close>Fechar</button></div>`);
  $('#cpy2').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link copiado')}catch(e){}}});
 $('#aLoja').onchange=e=>{APP.loja=e.target.value;listaClientes()};listaClientes();listaPend()}
async function listaClientes(){let q=sb.from('clientes_app').select('id,local_id,nome,unidade,cpf_mascara,compra_liberada,ativo,bloqueado_ate,ultimo_acesso,criado_em').eq('empresa_id',S.emp.id).order('nome');if(APP.loja)q=q.eq('local_id',APP.loja);
 const {data,error}=await q;const C=$('#aCli');if(!C)return;if(error){C.innerHTML=`<p class="vazio">${esc(error.message)}</p>`;return}S.clientes=data;
 const nome=id=>S.locais.find(l=>l.id===id)?.nome||'—',bloq=c=>c.bloqueado_ate&&new Date(c.bloqueado_ate)>new Date();
 C.innerHTML=`<table class="tbl"><thead><tr><th>Cliente</th><th>Loja</th><th>Último acesso</th><th>Compra no celular</th><th></th></tr></thead><tbody>${data.map(c=>`<tr style="${c.ativo?'':'opacity:.5'}"><td><b>${esc(c.nome)}</b><br><span class="mu sm">${esc(c.unidade)} · CPF ${esc(c.cpf_mascara)}</span>${bloq(c)?'<br><span class="pill warn">Bloqueado por senha errada</span>':''}</td><td>${esc(nome(c.local_id))}</td><td class="mu">${c.ultimo_acesso?new Date(c.ultimo_acesso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}</td>
  <td><label class="chk"><input type="checkbox" data-lib="${c.id}" ${c.compra_liberada?'checked':''}> Liberada para este cliente</label></td>
  <td class="n"><div class="row" style="justify-content:flex-end">${bloq(c)?`<button class="btn sm" data-desb="${c.id}">Desbloquear</button>`:''}<button class="btn sm pri" data-trav="${c.id}">Nova venda travada</button><button class="btn sm" data-ativo="${c.id}">${c.ativo?'Desativar':'Reativar'}</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="vazio">Nenhum cliente cadastrado ainda. Imprima o QR da loja e cole no balcão.</td></tr>'}</tbody></table>`;
 C.querySelectorAll('[data-lib]').forEach(x=>x.onchange=async()=>{const r=await sb.from('clientes_app').update({compra_liberada:x.checked}).eq('id',x.dataset.lib).select('id');if(r.error||!r.data?.length){x.checked=!x.checked;return toast('Não foi possível salvar')}toast(x.checked?'Compra pelo celular liberada para este cliente':'Liberação removida')});
 C.querySelectorAll('[data-desb]').forEach(x=>x.onclick=async()=>{const r=await sb.from('clientes_app').update({bloqueado_ate:null,tentativas:0}).eq('id',x.dataset.desb);if(r.error)return toast(r.error.message);toast('Cliente desbloqueado');listaClientes()});
 C.querySelectorAll('[data-ativo]').forEach(x=>x.onclick=async()=>{const c=data.find(y=>y.id===x.dataset.ativo);const r=await sb.from('clientes_app').update({ativo:!c.ativo}).eq('id',c.id);if(r.error)return toast(r.error.message);toast(c.ativo?'Cliente desativado':'Cliente reativado');listaClientes()});
 C.querySelectorAll('[data-trav]').forEach(x=>x.onclick=()=>novaTravada(x.dataset.trav))}
async function listaPend(){const {data,error}=await sb.from('vendas').select('id,local_id,total,iniciada_em,cliente_app_id,venda_itens(quantidade,produto_id)').eq('empresa_id',S.emp.id).eq('origem','pendente_app').eq('status','aberta').order('iniciada_em',{ascending:false});const C=$('#aPend');if(!C)return;if(error){C.innerHTML=`<p class="vazio">${esc(error.message)}</p>`;return}
 if(!S.clientes){const r=await sb.from('clientes_app').select('id,nome,unidade').eq('empresa_id',S.emp.id);S.clientes=r.data||[]}
 const cli=id=>S.clientes.find(c=>c.id===id),nomeP=id=>bonito(S.produtos.find(p=>p.id===id)?.nome||'—');
 C.innerHTML=`<table class="tbl"><thead><tr><th>Cliente</th><th>Itens</th><th>Registrada</th><th class="n">Total</th><th></th></tr></thead><tbody>${data.map(v=>`<tr><td><b>${esc(cli(v.cliente_app_id)?.nome||'—')}</b><br><span class="mu sm">${esc(cli(v.cliente_app_id)?.unidade||'')}</span></td><td class="sm">${v.venda_itens.map(i=>`${+i.quantidade}× ${esc(nomeP(i.produto_id))}`).join('<br>')}</td><td class="mu">${new Date(v.iniciada_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td class="n num"><b>${brl(v.total)}</b></td><td class="n"><button class="btn sm dang" data-canc="${v.id}">Cancelar</button></td></tr>`).join('')||'<tr><td colspan="5" class="vazio">Nenhuma venda travada em aberto.</td></tr>'}</tbody></table>`;
 C.querySelectorAll('[data-canc]').forEach(b=>b.onclick=async()=>{if(!confirmar('Cancelar esta venda travada? Ela some do app do cliente.'))return;const r=await sb.rpc('cancelar_venda_pendente',{p_venda:b.dataset.canc});if(r.error)return toast(r.error.message);toast('Venda travada cancelada');listaPend()})}
function novaTravada(cid){const c=S.clientes.find(x=>x.id===cid),itens=new Map();let q='';$('#modal').classList.add('wide');
 const precoLoja=pid=>S.precos.find(p=>p.produto_id===pid&&p.local_id===c.local_id)?.preco;
 const desenha=()=>{const t=q.trim().toLowerCase(),lista=S.produtos.filter(p=>p.ativo&&precoLoja(p.id)!=null&&(!t||p.nome.toLowerCase().includes(t)||(p.ean||'').includes(t))).slice(0,40),tot=[...itens].reduce((s,[id,n])=>s+precoLoja(id)*n,0);
  modal(`<h2>Venda travada para ${esc(c.nome)}</h2><p class="mu">${esc(c.unidade)}. Marque o que o cliente levou: a venda aparece no app dele para pagar com Pix ou cartão, e o estoque baixa quando ele pagar.</p>
   <input type="search" id="tq" placeholder="Buscar produto" value="${esc(q)}">
   <div class="tblwrap" style="max-height:40vh"><table class="tbl"><tbody>${lista.map(p=>`<tr><td>${esc(bonito(p.nome))}<br><span class="mu sm">${brl(precoLoja(p.id))}</span></td><td class="n"><div class="row" style="justify-content:flex-end"><button class="btn sm" data-m="${p.id}" data-d="-1">−</button><b class="num" style="min-width:24px;text-align:center">${itens.get(p.id)||0}</b><button class="btn sm" data-m="${p.id}" data-d="1">+</button></div></td></tr>`).join('')||'<tr><td class="vazio">Nenhum produto com preço nesta loja</td></tr>'}</tbody></table></div>
   <div class="row"><b>Total: <span class="num" style="color:var(--y)">${brl(tot)}</span></b><span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="okTrav" ${itens.size?'':'disabled'}>Enviar para o app do cliente</button></div>`);
  const i=$('#tq');i.focus();i.setSelectionRange(q.length,q.length);i.oninput=()=>{q=i.value;clearTimeout(i._t);i._t=setTimeout(desenha,200)};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const n=Math.max(0,(itens.get(b.dataset.m)||0)+ +b.dataset.d);n?itens.set(b.dataset.m,n):itens.delete(b.dataset.m);desenha()});
  $('#okTrav').onclick=async()=>{const r=await sb.rpc('criar_venda_pendente',{p_cliente:cid,p_itens:[...itens].map(([produto_id,quantidade])=>({produto_id,quantidade}))});if(r.error)return toast('Erro: '+r.error.message);fechar();toast('Venda enviada para o app de '+c.nome);listaPend()}};desenha()}

// ---------- tela: configurações ----------
function telaCfg(){const M=$('#main'),g=S.emp.gravacao||'intercorrencias',d=S.emp.dias_video||3,dono=S.papel==='dono';
 M.innerHTML=`<div class="head"><div><h1>Configurações</h1><p>Valem para todos os caixas da ${esc(S.emp.nome_exibicao||'empresa')}.</p></div></div>
  <div class="card" style="display:grid;gap:14px;max-width:760px"><div><h2 style="font-size:18px">Câmera de segurança do caixa</h2><p class="mu sm">O que a câmera frontal grava em cada compra.</p></div>
   <label class="opt"><input type="radio" name="grav" value="intercorrencias" ${g==='intercorrencias'?'checked':''} ${dono?'':'disabled'}><span><b>Só intercorrências</b><small>Grava compras canceladas, abandonadas ou com pagamento recusado. Gasta pouco espaço.</small></span></label>
   <label class="opt"><input type="radio" name="grav" value="tudo" ${g==='tudo'?'checked':''} ${dono?'':'disabled'}><span><b>Gravar tudo</b><small>Grava todas as compras, inclusive as pagas. Usa bem mais espaço.</small></span></label>
   <label class="opt"><input type="radio" name="grav" value="desligado" ${g==='desligado'?'checked':''} ${dono?'':'disabled'}><span><b>Não gravar</b><small>A câmera aparece na tela, mas nada é gravado.</small></span></label>
   <label class="f" style="max-width:260px">Guardar os vídeos por<select id="dias" ${dono?'':'disabled'}>${[1,3,7,15,30].map(n=>`<option value="${n}" ${n===d?'selected':''}>${n} ${n===1?'dia':'dias'}</option>`).join('')}</select></label>
   ${dono?'<div class="row"><span class="sp"></span><button class="btn pri" id="salvarCfg">Salvar</button></div>':'<p class="mu sm">Só o dono pode mudar estas opções.</p>'}
  </div>
  <div class="card" style="max-width:760px;margin-top:16px"><h2 style="font-size:18px">Regra de preço para produtos novos</h2><p class="mu sm" style="margin-top:4px">Custo ÷ ${String(regra().divisor).replace('.',',')}, arredondado para cima terminando em ,${String(regra().terminacaoCentavos).padStart(2,'0')}. Exemplo: custo ${brl(204)} → ${brl(precoSugerido(204))}.</p></div>`;
 if(dono)$('#salvarCfg').onclick=async()=>{const gv=M.querySelector('input[name=grav]:checked').value,dv=+$('#dias').value;const r=await sb.from('empresas').update({gravacao:gv,dias_video:dv}).eq('id',S.emp.id);if(r.error)return toast('Erro: '+r.error.message);S.emp.gravacao=gv;S.emp.dias_video=dv;toast('Configuração salva. Os caixas aplicam em até 10 minutos.')}}

// ---------- ponte para o assistente (skill no Claude no Chrome): só funciona com o login aberto ----------
window.beep={
 async produtos(filtro='todos'){if(!S.emp)throw new Error('Faça login no painel');await carregar();const {data:f}=await sb.from('produto_fotos').select('produto_id').eq('empresa_id',S.emp.id);const com=new Set((f||[]).map(x=>x.produto_id));
  const {data:nc}=await sb.from('produtos').select('id,ncm,ncm_sugerido').eq('empresa_id',S.emp.id);const ncm=new Map((nc||[]).map(x=>[x.id,x]));
  return S.produtos.filter(p=>p.ativo).map(p=>({id:p.id,nome:p.nome,ean:p.ean,codigos:S.codigos.filter(c=>c.produto_id===p.id).map(c=>c.ean),temFoto:com.has(p.id),ncm:ncm.get(p.id)?.ncm||null,ncmSugerido:ncm.get(p.id)?.ncm_sugerido||null}))
   .filter(p=>filtro==='semFoto'?!p.temFoto:filtro==='semNcm'?!p.ncm:true)},
 async importarFoto(produtoId,url){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Faça login no painel');
  const r=await fetch(SB_URL+'/functions/v1/gestao',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({acao:'importar_foto',produto_id:produtoId,url})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Falhou');return j},
 async sugerirNcm(produtoId,ncm,fonte){if(!S.emp)throw new Error('Faça login no painel');if(!/^\d{8}$/.test(String(ncm)))throw new Error('NCM precisa ter 8 dígitos');const r=await sb.from('produtos').update({ncm_sugerido:String(ncm),ncm_fonte:String(fonte||'assistente').slice(0,200)}).eq('id',produtoId).eq('empresa_id',S.emp.id).select('id');if(r.error)throw r.error;if(!r.data.length)throw new Error('Produto não encontrado');return {ok:true}}
};
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')telaLogin()});
iniciar();
</script>
