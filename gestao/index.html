<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PagNow · Gestão</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../site/marca/simbolo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>try{var t=localStorage.getItem('pn-tema');if(t==='claro'||t==='medio')document.documentElement.dataset.tema=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0e;--p1:#131418;--p2:#1a1c21;--p3:#23262d;--line:#2a2d35;--ink:#f3f4f6;--mu:#9aa0ab;--y:#ffd60a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#38bdf8;--r:16px;
 --yt:#ffd60a;--okt:var(--okt);--warnt:var(--warnt);--badt:var(--badt);--newt:var(--newt);--dangt:var(--dangt);--avisot:var(--avisot);--infot:var(--infot);--perigot:var(--perigot);--mu2:var(--mu2);--mu3:var(--mu3);--hl:var(--hl);--tip:#0f1013;--vazio:#161616;--sombra:rgba(0,0,0,.45);color-scheme:dark}
/* tema médio: grafite, menos contraste que o escuro */
html[data-tema=medio]{--bg:#1b1e24;--p1:#23272f;--p2:#2a2f38;--p3:#333944;--line:#3a404c;--ink:#f1f3f6;--mu:#a9b0bc;--mu2:#8a919e;--mu3:#7a818e;--hl:#4c5362;--tip:#1b1e24;--vazio:#2a2f38;--sombra:rgba(0,0,0,.35)}
/* tema claro: fundo branco, textos de destaque escurecidos para leitura */
html[data-tema=claro]{--bg:#f4f5f7;--p1:#ffffff;--p2:#f7f8fa;--p3:#eceef2;--line:#dfe2e8;--ink:#15171c;--mu:#5f6673;--mu2:#6b7280;--mu3:#9aa1ad;--hl:#c3c8d1;--tip:#ffffff;--vazio:#eceef2;--sombra:rgba(20,24,32,.14);
 --yt:#8a6500;--okt:#15803d;--warnt:#b45309;--badt:#dc2626;--newt:#0369a1;--dangt:#dc2626;--avisot:#92400e;--infot:#075985;--perigot:#991b1b;color-scheme:light}
html[data-tema=claro] .btn.pri,html[data-tema=claro] .btn.pri:hover{color:#111}
html[data-tema=claro] .card,html[data-tema=claro] .kpi,html[data-tema=claro] .tblwrap{box-shadow:0 1px 2px rgba(20,24,32,.05)}
html[data-tema=claro] input:focus,html[data-tema=claro] select:focus{box-shadow:0 0 0 3px rgba(212,166,0,.22)}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--p3);border:1px solid var(--line);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--hl)}.btn.pri{background:var(--y);color:#111;border-color:var(--y)}.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dang{color:var(--dangt)}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--p2);outline:none;width:100%}
input:focus,select:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,10,.15)}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mu);font-weight:500}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--p3);color:var(--mu);white-space:nowrap}
.pill.ok{background:rgba(34,197,94,.12);color:var(--okt)}.pill.warn{background:rgba(245,158,11,.13);color:var(--warnt)}.pill.bad{background:rgba(239,68,68,.13);color:var(--badt)}.pill.new{background:rgba(56,189,248,.13);color:var(--newt)}
.conf tr.semcad td{background:rgba(245,158,11,.07)}.conf tr.semcad td:first-child{box-shadow:inset 3px 0 #f59e0b}
.pgt input,.pgt select{height:42px!important;min-height:42px!important;box-sizing:border-box}.falta{border-color:var(--warn)!important}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi small{display:block;margin-top:4px;font-size:12px}.cpt tr.cpv td{background:rgba(239,68,68,.06)}.cpt tr.cpv td:first-child{box-shadow:inset 3px 0 var(--badt)}.pgt td{vertical-align:middle}.pgt input[type=date]{min-height:36px}
.mg{font-weight:600}.mg.baixa{color:var(--badt)}.mg.media{color:var(--warnt)}.mg.boa{color:var(--okt)}
.mu{color:var(--mu)}.sm{font-size:13px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(420px,100%);padding:32px;display:grid;gap:16px}
.login img{height:56px;width:auto;justify-self:start;object-fit:contain}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--p2);border-radius:12px;padding:4px}
.tabs2 button{min-height:38px;border-radius:9px;font-weight:600;color:var(--mu)}.tabs2 button.on{background:var(--p3);color:var(--ink)}
.erro{color:var(--badt);font-size:13px;min-height:18px}
.lembrar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu,#9aa0a6);cursor:pointer;user-select:none}.lembrar input{width:18px;height:18px;accent-color:var(--y);margin:0;flex:none}
/* app */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side img.logo{align-self:flex-start;height:52px;width:auto;max-width:200px;object-fit:contain;margin:0 8px 20px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600;text-align:left}
.nav:hover{background:var(--p2);color:var(--ink)}.nav.on{background:var(--p2);color:var(--ink);box-shadow:inset 3px 0 0 var(--y)}
.nav svg{flex:none}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:12px;padding:3px;border-radius:10px;background:var(--p2);border:1px solid var(--line)}
.temas button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:30px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mu)}
.temas button:hover{color:var(--ink)}.temas button.on{background:var(--p1);color:var(--ink);box-shadow:0 1px 2px var(--sombra)}
.temacard .temas{max-width:360px;margin-top:0}.temacard .temas button{min-height:38px;font-size:13px}
.temas i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--hl)}.tm-claro{background:#f4f5f7}.tm-medio{background:#2a2f38}.tm-escuro{background:#0b0c0e}
.navcmd{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;margin:0 0 14px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--mu);font-family:inherit;font-size:14px;font-weight:500;line-height:1.2;text-align:left;white-space:nowrap;cursor:pointer;transition:border-color .15s,color .15s}
.navcmd:hover,.navcmd:focus-visible{border-color:var(--y);color:var(--ink);outline:none}
.navcmd svg{flex:none}
.navcmd span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.navcmd kbd{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line);border-radius:6px;background:var(--p1);font-family:inherit;font-size:11px;font-weight:600;line-height:1;letter-spacing:.02em;color:var(--mu)}
.side .quem{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mu)}
main{padding:28px 32px 80px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:30px}.head p{color:var(--mu);margin-top:4px}
.drop{border:2px dashed var(--hl);border-radius:20px;padding:48px 24px;text-align:center;display:grid;gap:10px;place-items:center;background:var(--p1);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--y);background:rgba(255,214,10,.05)}
.drop .ic{width:64px;height:64px;border-radius:18px;background:rgba(255,214,10,.1);color:var(--yt);display:grid;place-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.fis{display:grid;gap:6px;justify-items:start;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.fis .chk{padding:4px 8px;font-size:12px;line-height:1.35;align-items:flex-start}.fis .chk input{margin-top:2px}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi span{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font:800 22px Manrope,Inter,sans-serif;margin-top:4px}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:var(--p1)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}.tbl .n{text-align:right}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--p1)}
.inp-s{min-height:34px!important;padding:0 8px!important;width:92px!important;text-align:right}
.stack{display:grid;gap:4px}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:var(--avisot);font-size:14px}
.aviso.info{background:rgba(56,189,248,.07);border-color:rgba(56,189,248,.25);color:var(--infot)}
.barra{position:sticky;bottom:0;margin-top:18px;background:rgba(11,12,14,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-size:13px;cursor:pointer}.chk input{accent-color:var(--y)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:50}.modal.on{display:grid}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;padding:26px}
.modal.wide .card{width:min(980px,100%)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#111;padding:12px 18px;border-radius:12px;font-weight:600;transition:.2s;z-index:60;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.adcard{padding:12px}
.adprev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--p2);border:1px solid var(--line)}.adprev img,.adprev video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adprev .vel{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}.adtx{position:absolute;left:12px;right:12px;bottom:10px;display:grid;gap:2px}
.adtx b{font:800 16px/1.2 Manrope,Inter,sans-serif;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.adtx span{font-size:12.5px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adprev .selo{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:7px}.adprev .cta{position:absolute;right:10px;top:10px;background:var(--y);color:#111;font-weight:700;font-size:11.5px;padding:5px 9px;border-radius:999px}
.adform{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fone{background:#0b0b0b;border:1px solid var(--line);border-radius:26px;padding:14px;display:grid;gap:10px;max-width:320px}.fgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fgrade i{aspect-ratio:1;border-radius:12px;background:var(--vazio);border:1px solid var(--line)}
.adprev .pill{background:rgba(10,10,10,.72);backdrop-filter:blur(6px)}.adprev .pill.ok{color:var(--okt)}.adprev .pill.warn{color:var(--warnt)}.adprev .pill.new{color:var(--newt)}
input[type=file]{font-size:13px;color:var(--mu)}input[type=file]::file-selector-button{font:600 13px Inter,sans-serif;color:var(--ink);background:var(--p3);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-right:10px;cursor:pointer}
@media(max-width:900px){.adform,.g2{grid-template-columns:1fr}.fone{max-width:none}.hm{display:none}.anacts{flex-direction:column;align-items:stretch}}
.pcard{border-top:3px solid var(--c,#22c55e)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--p2);cursor:pointer}
.opt:has(input:checked){border-color:var(--y);background:rgba(255,214,10,.05)}.opt input{accent-color:var(--y);margin-top:4px}
.opt b{display:block}.opt small{color:var(--mu)}
.opt-tit{font:600 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:4px 0 -4px}
.cont-on{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--avisot);font-size:13px;line-height:1.35}
.cont-on i{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex:none;box-shadow:0 0 0 4px rgba(245,158,11,.2)}
.vazio{padding:28px;text-align:center;color:var(--mu)}
@media print{body:has(#modal.on #cartaz) .app,body:has(#modal.on #cartaz) #toast,#mbox .row{display:none!important}body:has(#modal.on #cartaz) #modal{position:static;inset:auto;background:none;display:block;padding:0}body:has(#modal.on #cartaz) #mbox{box-shadow:none;border:0;background:#fff;max-width:none;width:auto;max-height:none;overflow:visible}#cartaz,#cartaz h2{color:#000!important}#cartaz .mu{color:#333!important}}
@media print{.side,.head .row,.barra{display:none!important}.app{display:block}body,html{background:#fff;color:#000}.tblwrap,.kpi,.card{background:#fff;border-color:#ccc}.tbl th{background:#fff;color:#333}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow:auto;padding:12px}.side img,.side .quem{display:none}main{padding:20px 16px 80px}.grid4,.grid5{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}

/* produtos */
.prbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.prbusca{position:relative;flex:1;min-width:260px}.prbusca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}.prbusca input{padding-left:40px!important}
.prchip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--p2);color:var(--mu);font-weight:600;font-size:13px}
.prchip span{background:var(--p3);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px}.prchip.on{border-color:var(--y);color:var(--ink);background:rgba(255,214,10,.08)}.prchip.on span{background:var(--y);color:#111}
.prtbl tbody tr{cursor:pointer;transition:background .12s}.prtbl tbody tr:hover{background:var(--p2)}.prtbl td{vertical-align:middle}
.prthumb{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#9aa0ab}.prthumb img{width:100%;height:100%;object-fit:contain}
.prform{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.prfoto{display:grid;gap:10px;position:sticky;top:0}.prfbox{aspect-ratio:1;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#6b7280}.prfbox img{width:100%;height:100%;object-fit:contain}
.prsec{display:grid;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}.prsec h3{font-size:15px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:12px}
@media(max-width:900px){.prform,.g3{grid-template-columns:1fr}.prfoto{position:static}}
/* início */
.navsec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu2);padding:14px 12px 4px}
.ini{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.ini h2{font-size:17px;margin-bottom:4px}
.kpi small{display:block;font-size:12.5px;color:var(--mu);margin-top:2px;font-weight:500}.kpi small.up{color:var(--okt)}.kpi small.dn{color:var(--warnt)}
.at{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}.at:first-of-type{border-top:0}
.at .dot{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--p3);color:var(--mu);margin-top:1px}
.at.bad .dot{background:rgba(239,68,68,.14);color:var(--badt)}.at.warn .dot{background:rgba(245,158,11,.14);color:var(--warnt)}.at.info .dot{background:rgba(56,189,248,.12);color:var(--newt)}
.at .tx{flex:1;min-width:0}.at .tx b{display:block;font-size:14.5px}.at .tx p{color:var(--mu);font-size:13px;margin-top:2px}
.at .btn{flex:none;align-self:center}
.tudo{display:flex;gap:14px;align-items:center;padding:18px;border-radius:14px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.22);margin-top:12px}
.tudo .dot{width:38px;height:38px;border-radius:12px;background:rgba(34,197,94,.16);color:var(--okt);display:grid;place-items:center;flex:none}
.atalhos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.atalho{display:flex;gap:12px;align-items:center;text-align:left;padding:16px;border-radius:14px;background:var(--p1);border:1px solid var(--line);transition:border-color .15s,background .15s}
.atalho:hover{border-color:var(--hl);background:var(--p2)}.atalho .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,214,10,.1);color:var(--yt);display:grid;place-items:center;flex:none}
.atalho b{display:block;font-size:14px}.atalho span{font-size:12.5px;color:var(--mu)}
.ljrow{cursor:pointer}.ljrow:hover td{background:var(--p2)}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--p2),var(--p3),var(--p2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
@media(max-width:1100px){.ini{grid-template-columns:1fr}.atalhos{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.navsec{display:none}.side .nav{white-space:nowrap;flex:none}}
@media(max-width:560px){.atalhos{grid-template-columns:1fr}.at{flex-wrap:wrap}.at .tx{flex-basis:calc(100% - 48px)}.at .btn{margin-left:48px}#iLj .tbl td,#iLj .tbl th{padding-left:10px;padding-right:10px}}
/* abastecimento: mínimo e máximo */

const tx=(el,sel)=>{if(!el)return '';const n=el.getElementsByTagName(sel)[0];return n?n.textContent.trim():''};
const nr=v=>{const n=parseFloat(String(v||'0'));return Number.isFinite(n)?n:0};
const centavos=r=>Math.round(r*100);
const eanOk=v=>/^\d{8,14}$/.test(v)?v:null;
function lerNFe(xml){if(xml.length>5e6)throw new Error('Arquivo grande demais');
 const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('O arquivo não é um XML válido');
 const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não encontrei a NF-e dentro do arquivo. Use o XML da nota (não o PDF/DANFE).');
 const chave=(inf.getAttribute('Id')||'').replace(/^NFe/,'');if(!/^\d{44}$/.test(chave))throw new Error('Chave de acesso inválida no XML');
 const mod=tx(inf.getElementsByTagName('ide')[0],'mod');if(mod&&mod!=='55')throw new Error('Esta é uma nota modelo '+mod+'. Para entrada de mercadoria use a NF-e modelo 55.');

// ICMS do item na nota do fornecedor: diz se a mercadoria já veio com ST (retida ou cobrada antes)
const CST_ST=new Set(['10','30','60','70']),CSOSN_ST=new Set(['201','202','203','500']);
function lerFiscalItem(imp){const r={icmsCst:'',st:false,pisCst:''};if(!imp)return r;
 const icms=imp.getElementsByTagName('ICMS')[0],g=icms&&[...icms.children][0];
 if(g){const cst=tx(g,'CST'),csosn=tx(g,'CSOSN');r.icmsCst=csosn||cst;
  const temValor=['vICMSST','vICMSSTRet','vBCSTRet','vICMSSubstituto'].some(t=>nr(tx(g,t))>0);
  r.st=CSOSN_ST.has(csosn)||CST_ST.has(cst)||(['90','900'].includes(r.icmsCst)&&temValor)}
 const pis=imp.getElementsByTagName('PIS')[0];if(pis){const gp=[...pis.children][0];r.pisCst=gp?tx(gp,'CST'):''}
 return r}
// grupo fiscal sugerido pela nota (regra do contador): com ST = CSOSN 500/5405, sem ST = CSOSN 201/5403.
// PIS/COFINS: 04 (monofásico) se o cadastro já é 04 ou o fornecedor usou 04; senão 49.
function grupoDe(st,pis){const gs=S.grupos||[],pref=st?/^com st/i:/^sem st/i,cs=st?'500':'201';
 const cand=gs.filter(g=>g.csosn===cs&&g.cst_pis_cofins===pis);return cand.find(g=>pref.test(g.nome))||cand[0]||null}
const grupoNome=id=>(S.grupos||[]).find(g=>g.id===id)?.nome||'sem grupo';
function sugerirFiscal(it,prod,n=S.nota){if(n?.tipo==='cupom')return {ncm:null,cest:null,grupo:null,mudaNcm:false,mudaGrupo:false,stSemCadastro:false,aplicar:false};const gAtual=prod&&(S.grupos||[]).find(g=>g.id===prod.grupo_fiscal_id);
 const pis=(gAtual?.cst_pis_cofins==='04'||it.pisCst==='04')?'04':'49';
 const ncmNota=/^\d{8}$/.test(it.ncm)?it.ncm:null,cestNota=/^\d{7}$/.test(it.cest||'')?it.cest:null;
 if(!prod){const g=grupoDe(it.st,pis);return {ncm:ncmNota,cest:cestNota,grupo:g?.id||null,mudaNcm:false,mudaGrupo:false,stSemCadastro:false,aplicar:true}}

 const gNovo=it.st&&atualST!==true?grupoDe(true,pis):null;

// casa cada item com o cadastro: primeiro pelo código do fornecedor, depois pelo código de barras
function conferir(n){const porEan=new Map();S.produtos.forEach(p=>{if(p.ean)porEan.set(p.ean,p)});S.codigos.forEach(c=>{const p=S.produtos.find(x=>x.id===c.produto_id);if(p)porEan.set(c.ean,p)});
 return n.itens.map(it=>{let p=null,por=null;const cf=S.codForn.find(c=>c.fornecedor_cnpj===n.fornCnpj&&c.codigo===it.codigo);
  if(cf){p=S.produtos.find(x=>x.id===cf.produto_id);por='codigo';if(cf.fator&&+cf.fator!==1&&it.fator===1){it.fator=+cf.fator;it.custoUn=Math.round(it.custoTotal/(it.qCom*it.fator))}}
  if(!p&&(it.eanUn||it.ean)){p=porEan.get(it.eanUn)||porEan.get(it.ean)||null;if(p)por='ean'}
  const sug=!p&&n.tipo==='cupom'&&CUPOM?CUPOM.sugestoes(it.desc,S.produtos):null;

async function prSalvar(pid,arquivo){
 const F=$('#prF'),err=m=>{$('#prErro').textContent=m;return false},bt=$('#prSalvar');
 const nome=F.nome.value.trim().replace(/\s+/g,' '),ean=soDig(F.ean.value),ncm=soDig(F.ncm.value),cest=soDig(F.cest.value),custo=prCent(F.custo.value)??0;
 const extras=[...new Set(F.extras.value.split(/[,;\s]+/).map(soDig).filter(Boolean))].filter(e=>e!==ean);
 if(nome.length<2)return err('Informe o nome do produto.');
 if(ean&&(ean.length<8||ean.length>14))return err('O código de barras precisa ter de 8 a 14 dígitos.');
 if(extras.some(e=>e.length<8||e.length>14))return err('Cada código extra precisa ter de 8 a 14 dígitos.');
 if(ncm&&ncm.length!==8)return err('O NCM precisa ter 8 dígitos.');
 if(cest&&cest.length!==7)return err('O CEST precisa ter 7 dígitos.');
 if(Number.isNaN(custo))return err('Custo inválido. Use o formato 4,59.');
 const z=s=>s.replace(/^0+/,'');const meus=new Set([ean,...extras].filter(Boolean).map(z));
 const dono=S.produtos.find(x=>x.id!==pid&&(meus.has(z(x.ean||''))||S.codigos.some(c=>c.produto_id===x.id&&meus.has(z(c.ean)))));
 if(dono)return err(`Esse código de barras já está em "${dono.nome}".`);
 const precos=[];for(const i of document.querySelectorAll('[data-pl]')){const v=prCent(i.value);if(Number.isNaN(v))return err('Preço inválido em uma das lojas. Use o formato 12,90.');if(v===0)return err('Preço zero não vale. Deixe em branco a loja que não vende o produto.');if(v!=null)precos.push({local_id:i.dataset.pl,preco:v,ativo_no_mix:document.querySelector(`[data-mx="${i.dataset.pl}"]`).checked})}
 const g=(PR.grupos||[]).find(x=>x.id===F.grupo.value);
 const dados={nome,ean:ean||null,unidade:F.unidade.value,custo,idade_minima:F.maior18.checked?18:null,sem_nfce:F.semnfce.checked,ncm:ncm||null,cest:cest||null,origem:+F.origem.value,grupo_fiscal_id:g?.id||null,cfop_saida:g?.cfop_saida||null,atualizado_em:new Date().toISOString()};
 if(ncm&&ncm!==(PR.det?.get(pid)?.ncm||'')){dados.ncm_sugerido=ncm;dados.ncm_fonte='Painel de gestão'}
 bt.disabled=true;bt.textContent='Salvando…';
 try{const e=S.emp.id;let id=pid;
  if(pid){const r=await sb.from('produtos').update(dados).eq('id',pid).eq('empresa_id',e);if(r.error)throw r.error}
  else{const r=await sb.from('produtos').insert({...dados,empresa_id:e,ativo:true}).select('id').single();if(r.error)throw r.error;id=r.data.id}
  const antes=S.codigos.filter(c=>c.produto_id===id).map(c=>c.ean),sai=antes.filter(c=>!extras.includes(c)),entra=extras.filter(c=>!antes.includes(c));
  if(sai.length){const r=await sb.from('produto_codigos').delete().eq('produto_id',id).eq('empresa_id',e).in('ean',sai);if(r.error)throw r.error}
  if(entra.length){const r=await sb.from('produto_codigos').insert(entra.map(c=>({empresa_id:e,produto_id:id,ean:c})));if(r.error)throw r.error}
  if(precos.length){const r=await sb.from('precos_local').upsert(precos.map(x=>({...x,empresa_id:e,produto_id:id,atualizado_em:new Date().toISOString()})),{onConflict:'produto_id,local_id'});if(r.error)throw r.error}
  const limpos=[...document.querySelectorAll('[data-pl]')].filter(i=>!i.value.trim()).map(i=>i.dataset.pl);
  if(pid&&limpos.length){const r=await sb.from('precos_local').delete().eq('produto_id',id).eq('empresa_id',e).in('local_id',limpos);if(r.error)throw r.error}
  if(arquivo){const ext=arquivo.type==='image/png'?'png':arquivo.type==='image/webp'?'webp':'jpg',path=`${e}/${id}/manual-${Date.now()}.${ext}`;
   const up=await sb.storage.from('produtos').upload(path,arquivo,{contentType:arquivo.type});if(up.error)throw new Error('A foto não subiu: '+up.error.message);
   await sb.from('produto_fotos').delete().eq('produto_id',id).eq('empresa_id',e).eq('principal',true);
   const r=await sb.from('produto_fotos').insert({empresa_id:e,produto_id:id,path,principal:true,ordem:0});if(r.error)throw r.error}
  fechar();toast(pid?'Produto salvo. Os caixas atualizam em até 10 minutos.':'Produto cadastrado. Os caixas recebem em até 10 minutos.');
  await carregar();await prCarregarExtras(true);telaProd()}
 catch(x){bt.disabled=false;bt.textContent=pid?'Salvar alterações':'Cadastrar produto';err('Não foi possível salvar: '+(x.message||x))}}

  <label class="f">Assinatura secreta do webhook<input id="mpSeg" type="password" autocomplete="off" spellcheck="false" placeholder="${st.webhook?'Deixe vazio para manter a atual':'Copie em Webhooks › Modo de produção'}"></label>
  <p class="mu sm">Onde achar: <a href="https://www.mercadopago.com.br/developers/panel/app" target="_blank" rel="noopener" style="color:var(--ink)">painel de desenvolvedor do Mercado Pago</a> › sua aplicação › <b>Credenciais de produção</b> (Access Token, não a Public Key) e <b>Webhooks</b> (Assinatura secreta).</p>

async function apiNf(acao,corpo={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Entre no painel de novo');const r=await fetch(SB_URL+'/functions/v1/nfce',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({acao,...corpo})});const j=await r.json().catch(()=>({erro:'Resposta inválida'}));if(!r.ok)throw new Error(j.erro||'Erro');return j}

 try{if(nx){const r=await apiNf('xml',{venda_id:nx.dataset.nfxml});location.href=r.url;b.disabled=false;b.textContent=t;return}
  const r=await apiNf('reenviar',{venda_id:nr.dataset.nfre});const st=r.resultado?.status;toast(st==='autorizada'?'Nota autorizada':st==='rejeitada'?'A SEFAZ rejeitou: '+(r.resultado.motivo||''):'Nota na fila. A SEFAZ responde em instantes.');telaVend()}

  <div class="card temacard" style="display:grid;gap:12px;max-width:760px;margin-bottom:16px"><div><h2 style="font-size:18px">Aparência do Painel</h2><p class="mu sm">Escolha o tema deste aparelho. Não muda os caixas nem o app do cliente.</p></div>${seletorTema()}</div>
  <div class="card" style="display:grid;gap:14px;max-width:760px"><div><h2 style="font-size:18px">Câmera de segurança do caixa</h2><p class="mu sm">O que a câmera frontal grava em cada compra.</p></div>
   <label class="opt"><input type="radio" name="grav" value="intercorrencias" ${g==='intercorrencias'?'checked':''} ${dono?'':'disabled'}><span><b>Só intercorrências</b><small>Grava compras canceladas, abandonadas ou com pagamento recusado. Gasta pouco espaço.</small></span></label>
   <label class="opt"><input type="radio" name="grav" value="tudo" ${g==='tudo'?'checked':''} ${dono?'':'disabled'}><span><b>Gravar tudo</b><small>Grava todas as compras, inclusive as pagas. Usa bem mais espaço.</small></span></label>
   <label class="opt"><input type="radio" name="grav" value="desligado" ${g==='desligado'?'checked':''} ${dono?'':'disabled'}><span><b>Não gravar</b><small>A câmera aparece na tela, mas nada é gravado.</small></span></label>
   <label class="f" style="max-width:260px">Guardar os vídeos por<select id="dias" ${dono?'':'disabled'}>${[1,3,7,15,30].map(n=>`<option value="${n}" ${n===d?'selected':''}>${n} ${n===1?'dia':'dias'}</option>`).join('')}</select></label>
   ${dono?'<div class="row"><span class="sp"></span><button class="btn pri" id="salvarCfg">Salvar</button></div>':'<p class="mu sm">Só o dono pode mudar estas opções.</p>'}
  </div>
  <div class="card" style="max-width:760px;margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h2 style="font-size:18px">Aviso de câmera (LGPD)</h2><p class="mu sm" style="margin-top:4px">Cartaz para colar perto do caixa. O app do cliente já pede o aceite dos <a href="../termos/" target="_blank" style="color:var(--ink)">Termos e Privacidade</a>, que explicam a gravação.</p></div><button class="btn" id="cartazCam">Imprimir cartaz</button></div>
  <div class="card" id="marcaCard" style="max-width:760px;margin-top:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div id="marcaPrev" style="width:104px;height:104px;border-radius:14px;background:var(--soft,#f3f3f1);display:grid;place-items:center;overflow:hidden;flex:none"></div><div style="flex:1;min-width:240px"><h2 style="font-size:18px">Logo da loja nas telas</h2><p class="mu sm" style="margin-top:4px">Aparece no caixa de autoatendimento e no app do cliente no lugar do logo padrão. PNG, JPG, WebP ou SVG; o ideal é fundo transparente. Os caixas trocam em até 10 minutos.</p>${dono?'<div class="row" style="margin-top:10px"><input type="file" id="marcaArq" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden><button class="btn pri" id="marcaEnviar">Enviar logo</button><button class="btn" id="marcaTirar" hidden>Voltar ao padrão</button></div>':'<p class="mu sm" style="margin-top:8px">Só o dono pode trocar o logo.</p>'}</div></div>
  <div class="card" id="mpCard" style="max-width:760px;margin-top:16px;display:grid;gap:12px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h2 style="font-size:18px">Maquininha de cartão · Mercado Pago</h2><p class="mu sm" style="margin-top:4px">Credencial da conta que recebe as vendas no cartão dos caixas. Fica guardada só no servidor, nunca no tablet.</p></div><span class="pill" id="mpEstado">Verificando…</span></div><div id="mpCorpo"></div></div>
  <div class="card" id="nfCard" style="max-width:760px;margin-top:16px;display:grid;gap:12px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h2 style="font-size:18px">Nota fiscal do consumidor · NFC-e</h2><p class="mu sm" style="margin-top:4px">O servidor emite a nota de cada venda paga, com o certificado A1 da empresa, direto na SEFAZ.</p></div><span class="pill" id="nfEstado">Verificando…</span></div><div id="nfCorpo"></div></div>
  <div class="card" style="max-width:760px;margin-top:16px"><h2 style="font-size:18px">Regra de preço para produtos novos</h2><p class="mu sm" style="margin-top:4px">Custo ÷ ${String(regra().divisor).replace('.',',')}, arredondado para cima terminando em ,${String(regra().terminacaoCentavos).padStart(2,'0')}. Exemplo: custo ${brl(204)} → ${brl(precoSugerido(204))}.</p></div>`;
 $('#cartazCam').onclick=async()=>{const dias=S.emp.dias_video||3,g=S.emp.gravacao||'intercorrencias';$('#modal').classList.add('wide');
  modal(`<div id="cartaz" style="display:grid;gap:16px;justify-items:center;text-align:center;padding:10px">${await logoCartaz(52)}<div style="width:110px;height:110px;border-radius:30px;background:var(--y);display:grid;place-items:center"><svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><rect x="2" y="7" width="14" height="10" rx="2"/><path d="M16 11l6-3v8l-6-3"/><circle cx="9" cy="12" r="2.2"/></svg></div>
   <h2 style="font-size:34px;line-height:1.1">Ambiente monitorado<br>por câmera</h2><p style="max-width:520px;font-size:18px" class="mu">O caixa de autoatendimento grava vídeo ${g==='tudo'?'durante as compras':'em ocorrências (compras canceladas, abandonadas ou recusadas)'} para a segurança de todos. As imagens ficam guardadas por até ${dias} ${dias===1?'dia':'dias'}, só a loja tem acesso, e depois são apagadas.</p>
   <p class="mu sm">Lei nº 13.709/2018 (LGPD) · ${esc(S.emp.razao_social||'')} · Saiba mais: ${esc(location.origin+location.pathname.replace(/gestao\/?.*$/,''))}termos/#camera</p></div>
   <div class="row"><span class="sp"></span><button class="btn" data-close>Fechar</button><button class="btn pri" onclick="window.print()">Imprimir</button></div>`)};
 cartaoMp();cartaoNf();cartaoMarca();
 if(dono)$('#salvarCfg').onclick=async()=>{const gv=M.querySelector('input[name=grav]:checked').value,dv=+$('#dias').value;const r=await sb.from('empresas').update({gravacao:gv,dias_video:dv}).eq('id',S.emp.id);if(r.error)return toast('Erro: '+r.error.message);S.emp.gravacao=gv;S.emp.dias_video=dv;toast('Configuração salva. Os caixas aplicam em até 10 minutos.')}}

// logo da loja nos cartazes impressos (marca própria); sem logo, o nome da loja
async function logoCartaz(h){if(S.emp.logo_path){const {data}=await sb.storage.from('marca').createSignedUrl(S.emp.logo_path,3600);if(data?.signedUrl)return `<img src="${esc(data.signedUrl)}" alt="${esc(S.emp.nome_exibicao||'')}" style="height:${h}px;width:auto;object-fit:contain">`}
 return `<b style="font:800 ${Math.round(h*.55)}px Manrope,Inter,sans-serif">${esc(S.emp.nome_exibicao||'')}</b>`}

// ---------- logo da empresa (marca própria): bucket privado "marca", caminho <empresa>/logo-<data>.png ----------
// O arquivo é redesenhado num canvas de no máximo 512 px (PNG): fica leve para o caixa guardar e mostrar sem internet.
async function cartaoMarca(){const P=$('#marcaPrev');if(!P)return;const tirar=$('#marcaTirar');
 const vazio=()=>{P.innerHTML='<span class="mu sm" style="text-align:center;padding:8px">Sem logo: aparece o nome da loja</span>';if(tirar)tirar.hidden=true};
 if(!S.emp.logo_path)vazio();else{const {data}=await sb.storage.from('marca').createSignedUrl(S.emp.logo_path,3600);
  if(data?.signedUrl){P.innerHTML=`<img src="${esc(data.signedUrl)}" alt="Logo" style="max-width:92px;max-height:92px;object-fit:contain">`;if(tirar)tirar.hidden=false}else vazio()}
 const env=$('#marcaEnviar'),arq=$('#marcaArq');if(!env)return;env.onclick=()=>arq.click();
 arq.onchange=async()=>{const f=arq.files[0];arq.value='';if(!f)return;if(f.size>5e6)return toast('Arquivo maior que 5 MB');
  env.disabled=true;env.textContent='Enviando…';
  try{const url=URL.createObjectURL(f),img=new Image();await new Promise((ok,er)=>{img.onload=ok;img.onerror=()=>er(new Error('Não consegui abrir esta imagem'));img.src=url});
   const w=img.naturalWidth||512,h=img.naturalHeight||512,k=Math.min(1,512/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
   const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));if(!blob)throw new Error('Não consegui converter a imagem');
   const path=`${S.emp.id}/logo-${Date.now()}.png`;const up=await sb.storage.from('marca').upload(path,blob,{contentType:'image/png'});if(up.error)throw new Error(up.error.message);
   const r=await sb.from('empresas').update({logo_path:path}).eq('id',S.emp.id);if(r.error)throw new Error(r.error.message);
   S.emp.logo_path=path;toast('Logo salvo. Os caixas trocam em até 10 minutos.');cartaoMarca()}catch(e){toast('Erro: '+e.message)}
  env.disabled=false;env.textContent='Enviar logo'};
 if(tirar)tirar.onclick=async()=>{if(!confirmar('Tirar o logo? Os caixas e o app passam a mostrar o nome da loja escrito.'))return;const r=await sb.from('empresas').update({logo_path:null}).eq('id',S.emp.id);if(r.error)return toast('Erro: '+r.error.message);S.emp.logo_path=null;toast('Logo retirado. Os caixas mostram o nome da loja.');cartaoMarca()}}

// ---------- ponte para o assistente (skill no Claude no Chrome): só funciona com o login aberto ----------
window.beep={
 async produtos(filtro='todos'){if(!S.emp)throw new Error('Faça login no painel');await carregar();const {data:f}=await sb.from('produto_fotos').select('produto_id').eq('empresa_id',S.emp.id);const com=new Set((f||[]).map(x=>x.produto_id));
  const {data:nc}=await sb.from('produtos').select('id,ncm,ncm_sugerido,cest,cfop_saida,origem,cclass_trib').eq('empresa_id',S.emp.id);const ncm=new Map((nc||[]).map(x=>[x.id,x]));
  return S.produtos.filter(p=>p.ativo).map(p=>{const f=ncm.get(p.id)||{};return {id:p.id,nome:p.nome,ean:p.ean,codigos:S.codigos.filter(c=>c.produto_id===p.id).map(c=>c.ean),temFoto:com.has(p.id),ncm:f.ncm||null,ncmSugerido:f.ncm_sugerido||null,cest:f.cest||null,cfop:f.cfop_saida||null,origem:f.origem??0,cclassTrib:f.cclass_trib||null}})
   .filter(p=>filtro==='semFoto'?!p.temFoto:filtro==='semNcm'?!p.ncm:filtro==='semFiscal'?(!p.ncm||!p.cfop):true)},
 // grava os dados fiscais OFICIAIS no cadastro (decisão do dono: grava direto e o contador revisa pela lista depois)
 async gravarFiscal(produtoId,dados={},fonte){if(!S.emp)throw new Error('Faça login no painel');const d=dados||{},u={},so=v=>String(v??'').replace(/\D/g,'');
  if(d.ncm!=null){const v=so(d.ncm);if(!/^\d{8}$/.test(v))throw new Error('NCM precisa ter 8 dígitos');u.ncm=v;u.ncm_sugerido=v}
  if(d.cest!=null){const v=so(d.cest);if(v&&!/^\d{7}$/.test(v))throw new Error('CEST precisa ter 7 dígitos');u.cest=v||null}
  if(d.cfop!=null){const v=so(d.cfop);if(!/^5\d{3}$/.test(v))throw new Error('CFOP de saída da NFC-e precisa ter 4 dígitos começando com 5 (ex.: 5102, 5405)');u.cfop_saida=v}
  if(d.origem!=null){const v=+d.origem;if(!Number.isInteger(v)||v<0||v>8)throw new Error('Origem precisa ser de 0 a 8');u.origem=v}
  if(d.cclassTrib!=null){const v=so(d.cclassTrib);if(v&&!/^\d{6}$/.test(v))throw new Error('cClassTrib precisa ter 6 dígitos');u.cclass_trib=v||null}
  if(!Object.keys(u).length)throw new Error('Nada para gravar');u.ncm_fonte=String(fonte||'assistente').slice(0,200);u.atualizado_em=new Date().toISOString();
  const r=await sb.from('produtos').update(u).eq('id',produtoId).eq('empresa_id',S.emp.id).select('id,nome,ncm,cest,cfop_saida,origem,cclass_trib');if(r.error)throw r.error;if(!r.data.length)throw new Error('Produto não encontrado ou sem permissão (só dono ou gerente)');return {ok:true,produto:r.data[0]}},
 async importarFoto(produtoId,url){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Faça login no painel');
  const r=await fetch(SB_URL+'/functions/v1/gestao',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({acao:'importar_foto',produto_id:produtoId,url})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Falhou');return j},
 async sugerirNcm(produtoId,ncm,fonte){if(!S.emp)throw new Error('Faça login no painel');if(!/^\d{8}$/.test(String(ncm)))throw new Error('NCM precisa ter 8 dígitos');const r=await sb.from('produtos').update({ncm_sugerido:String(ncm),ncm_fonte:String(fonte||'assistente').slice(0,200)}).eq('id',produtoId).eq('empresa_id',S.emp.id).select('id');if(r.error)throw r.error;if(!r.data.length)throw new Error('Produto não encontrado');return {ok:true}}
};
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')telaLogin();if(ev==='PASSWORD_RECOVERY'&&!RECUPERAR){RECUPERAR=true;telaNovaSenha()}});
iniciar();
</script>
