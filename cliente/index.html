<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beep · Minha loja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--k1:#141414;--k2:#1c1c1c;--k3:#262626;--line:#2c2c2c;--ink:#f5f5f5;--mu:#a1a1aa;--y:#ffd60a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
.logo{height:34px;width:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;font-weight:700;font-size:17px;width:100%;background:var(--k3);border:1px solid var(--line)}
.btn.y{background:var(--y);color:#111;border-color:var(--y)}.btn:disabled{opacity:.45}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}
.campo{display:grid;gap:6px;font-size:14px;color:var(--mu);font-weight:500}
.campo input{min-height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--k2);font-size:17px;color:var(--ink);outline:none;width:100%}
.campo input:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,10,.15)}
.pin{letter-spacing:.5em;text-align:center;font-size:24px!important;font-weight:700}
.card{background:var(--k1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.msg{color:#f87171;font-size:14px;min-height:20px}
.mu{color:var(--mu)}.sm{font-size:14px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--k2);border-radius:14px;padding:4px}.tabs2 button{min-height:44px;border-radius:11px;font-weight:600;color:var(--mu)}.tabs2 button.on{background:var(--k3);color:var(--ink)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.ola h1{font-size:22px}.ola p{color:var(--mu);font-size:14px}
.busca{position:relative;margin-bottom:12px}.busca input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--k2);padding:0 16px 0 44px;outline:none;font-size:16px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
.chips{display:flex;gap:8px;overflow:auto;margin-bottom:14px;scrollbar-width:none}.chips button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--k2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mu)}.chips button.on{background:var(--y);color:#111;border-color:var(--y)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:var(--k1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .foto{aspect-ratio:1;background:#fff;display:grid;place-items:center;padding:12px;position:relative}.prod .foto img{max-width:100%;max-height:100%;object-fit:contain}
.prod .foto.sem{background:linear-gradient(145deg,#1d1d1d,#121212);font:800 44px Manrope,Inter,sans-serif;color:var(--y)}
.prod.esg .foto img{opacity:.45}.prod.esg .foto.sem{color:rgba(255,214,10,.38)}
.prod .info{padding:10px 12px 12px;display:grid;gap:4px;flex:1}.prod .nome{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.prod .linha{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.prod .preco{font:800 17px Manrope,Inter,sans-serif;color:var(--y)}
.add{width:38px;height:38px;border-radius:12px;background:var(--y);color:#111;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none}
.est{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.est.tem{background:rgba(34,197,94,.9);color:#fff}.est.poucos{background:rgba(245,158,11,.95);color:#111}.est.esgotado{background:rgba(239,68,68,.92);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 10px;border-radius:12px;position:relative;min-width:62px}.nav button.on{color:var(--y)}
.badge{position:absolute;top:0;right:10px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.lista{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;background:var(--k1);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.th{width:54px;height:54px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--y);font:800 22px Manrope,Inter,sans-serif}.th.sem{background:#1d1d1d}.th img{max-width:100%;max-height:100%;object-fit:contain}
.item .n{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3}.item .n small{display:block;color:var(--y);font:800 15px Manrope,Inter,sans-serif;margin-top:2px}
.qtd{display:flex;align-items:center;gap:6px}.qtd button{width:36px;height:36px;border-radius:10px;background:var(--k3);font-weight:800;font-size:18px}.qtd b{min-width:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0}.total b{font:800 30px Manrope,Inter,sans-serif;color:var(--y)}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.forma{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--k2);display:grid;gap:4px;justify-items:center;font-weight:700}.forma.on{border-color:var(--y);background:rgba(255,214,10,.07)}
.vazio{text-align:center;color:var(--mu);padding:40px 16px}
.aviso{padding:12px 14px;border-radius:14px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fde68a;font-size:14px}
.ok-tela{min-height:70vh;display:grid;place-items:center;text-align:center;gap:12px;padding:20px}.ok-ic{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto}
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}.cam video{width:100%;height:100%;object-fit:cover}.cam .mira{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid var(--y);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#111;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.pend{border-left:4px solid var(--y)}
.aceite{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mu);line-height:1.45;cursor:pointer}.aceite input{width:22px;height:22px;accent-color:var(--y);flex:none;margin-top:1px}.aceite a,.lnk{color:var(--ink);font-weight:600}
.fav{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#9ca3af;box-shadow:0 1px 4px rgba(0,0,0,.12)}.fav.on{color:#ef4444}.fav svg{width:19px;height:19px}
.prod .linha{flex-wrap:wrap}.avisar{width:100%;justify-content:center;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--k2);font-size:12.5px;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--ink);flex:none}.avisar.on{border-color:rgba(255,214,10,.5);color:var(--y);background:rgba(255,214,10,.08)}.avisar svg{width:15px;height:15px}
.chegou{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(34,197,94,.05));border:1px solid rgba(34,197,94,.35);border-radius:16px;padding:12px 14px;margin-bottom:14px}.chegou b{display:block}.chegou .x{margin-left:auto;color:var(--mu);font-size:22px;width:32px;height:32px}
.ad .txt .lin{display:flex;align-items:center;gap:8px;min-width:0}.ad .txt .lin>span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.cupom{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.6);color:#fff;font:700 12.5px Inter,sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:8px;width:max-content}
.selo.casa{background:var(--y);color:#111}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--y);color:#111;display:grid;place-items:center;font:800 22px Manrope,Inter,sans-serif;flex:none}
.dobras{margin-top:14px;display:grid;gap:10px}.dobra{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;padding:0 16px;border-radius:16px;background:var(--k1);border:1px solid var(--line);font-weight:600;font-size:16px;text-align:left}
.dobra span{display:flex;align-items:center;gap:12px}.dobra svg{width:20px;height:20px;color:var(--mu)}.dobra i{font-style:normal;font-size:24px;color:var(--mu);transition:transform .2s}.dobra[aria-expanded=true] i{transform:rotate(90deg)}.dobra[aria-expanded=true]{border-color:#3a3a3a}
.dobra-c{margin-top:-4px}.linha-d{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}.linha-d:last-child{border:0}.linha-d span{color:var(--mu)}.linha-d b{text-align:right;font-weight:600}
.dobra-c:has(.linha-d){background:var(--k1);border:1px solid var(--line);border-radius:16px}
.denovo{margin-top:8px;height:38px;border-radius:11px;background:var(--k3);border:1px solid var(--line);font-weight:700;font-size:13.5px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
/* anúncios de parceiros */
.ads{position:relative;margin:0 -18px 16px;overflow:hidden}
.ads-trilho{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scroll-padding:0 18px;scrollbar-width:none}.ads-trilho::-webkit-scrollbar{display:none}
.ad{position:relative;flex:0 0 100%;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--k2);aspect-ratio:16/9;border:1px solid var(--line);text-align:left;display:block;width:100%}
.ad img,.ad video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad .vel{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}
.ad .txt{position:absolute;left:14px;right:14px;bottom:12px;display:grid;gap:2px}
.ad .txt b{font:800 18px/1.2 Manrope,Inter,sans-serif;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad .txt span{font-size:13px;color:rgba(255,255,255,.82);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ad .cta{position:absolute;right:12px;top:12px;background:var(--y);color:#111;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
.selo{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:8px}
.ads-pontos{display:flex;justify-content:center;gap:6px;margin-top:10px}.ads-pontos i{width:6px;height:6px;border-radius:3px;background:var(--k3);transition:.25s}.ads-pontos i.on{width:18px;background:var(--y)}
.ad-grade{grid-column:1/-1;aspect-ratio:2/1}
.ad-ok{margin-top:22px;aspect-ratio:16/9;width:100%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>
<script>
(()=>{
const API='https://gdnvjpmpfgautrmtkjmx.supabase.co/functions/v1/cliente';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const semAc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const bonito=n=>String(n||'').toLowerCase().replace(/(^|[\s\-(\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());
let token=ls.get('bc-token',null),loja=ls.get('bc-loja',null),me=null,cat=ls.get('bc-cat',null),carrinho=ls.get('bc-carrinho',[]),aba='produtos',filtro='todos',busca='',pend=[];
async function api(acao,dados={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({acao,...dados})});let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&token&&!['entrar','cadastrar'].includes(acao)){token=null;ls.del('bc-token');telaEntrada('entrar','Sua sessão expirou. Entre de novo.');throw new Error('sessão')}
 if(!r.ok)throw new Error(j.erro||'Não foi possível concluir');return j}
const ICON={coracao:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',sino:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',prod:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
 ler:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M14 8v8M17 8v8"/></svg>',
 pend:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3z"/><path d="M9 12h6M9 16h4"/></svg>',
 car:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></svg>',
 conta:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 lupa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'};
const foto=(p,cls)=>p.foto?`<span class="${cls}"><img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('sem');this.parentNode.textContent='${esc((p.nome||'?').trim().charAt(0).toUpperCase())}'"></span>`:`<span class="${cls} sem">${esc((p.nome||'?').trim().charAt(0).toUpperCase())}</span>`;

// ---------- loja pelo link (#l=ID) ----------
const m=location.hash.match(/l=([0-9a-f-]{36})/i);if(m){loja={id:m[1]};ls.set('bc-loja',loja);history.replaceState(null,'',location.pathname)}

// ---------- entrada: cadastro ou login ----------
function cpfFmt(v){v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
async function telaEntrada(modo,msg=''){$('#nav').style.display='none';
 if(!loja){$('#app').innerHTML=`<div class="ok-tela"><div><img class="logo" src="../logo.png" alt="Beep" style="height:44px"><h1 style="margin-top:24px;font-size:24px">Leia o QR code da sua loja</h1><p class="mu" style="margin-top:8px">O QR fica colado na loja do seu condomínio. Ele abre o app já na sua unidade.</p></div></div>`;return}
 if(!loja.nome){try{const r=await api('loja',{loja:loja.id});loja={id:loja.id,nome:r.loja.nome,empresa:r.empresa};ls.set('bc-loja',loja)}catch(e){$('#app').innerHTML=`<div class="ok-tela"><div><h1 style="font-size:22px">${esc(e.message)}</h1><p class="mu" style="margin-top:8px">Fale com o responsável pela loja.</p></div></div>`;return}}
 $('#app').innerHTML=`<img class="logo" src="../logo.png" alt="Beep"><div style="margin:22px 0 18px"><h1 style="font-size:26px">${modo==='cadastrar'?'Crie seu acesso':'Bem-vindo de volta'}</h1><p class="mu">Loja ${esc(loja.nome)}</p></div>
  <div class="tabs2" style="margin-bottom:16px"><button class="${modo==='cadastrar'?'on':''}" data-m="cadastrar">Primeiro acesso</button><button class="${modo==='entrar'?'on':''}" data-m="entrar">Já tenho cadastro</button></div>
  <form id="fEnt" class="card" style="display:grid;gap:14px">
   ${modo==='cadastrar'?`<label class="campo">Seu nome<input name="nome" autocomplete="name" required maxlength="80"></label><label class="campo">Casa ou apartamento<input name="unidade" placeholder="Ex.: Apto 302, Bloco B" required maxlength="30"></label>`:''}
   <label class="campo">CPF<input name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></label>
   <label class="campo">${modo==='cadastrar'?'Crie uma senha de 4 números':'Senha de 4 números'}<input name="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label>
   ${modo==='cadastrar'?'<label class="campo">Repita a senha<input name="pin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label>':''}
   ${modo==='cadastrar'?'<label class="aceite"><input type="checkbox" name="termos" required><span>Li e aceito os <a href="../termos/" target="_blank">Termos de uso</a> e a <a href="../termos/#privacidade" target="_blank">Política de privacidade</a>, inclusive o aviso de câmera da loja.</span></label>':''}
   <p class="msg" id="msg">${esc(msg)}</p><button class="btn y" type="submit">${modo==='cadastrar'?'Criar acesso':'Entrar'}</button>
   ${modo==='cadastrar'?'<p class="mu sm" style="text-align:center">Seu CPF é usado só para você entrar no app. Ele não fica visível para outras pessoas.</p>':''}

 document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>telaEntrada(b.dataset.m));

 document.querySelectorAll('[data-dobra]').forEach(b=>b.onclick=()=>{const k=b.dataset.dobra,c=$('#dc-'+k),abrir=c.hidden;c.hidden=!abrir;b.setAttribute('aria-expanded',abrir);if(!abrir){c.innerHTML='';return}

  carregarHist(c)})}
async function carregarHist(c){c.innerHTML='<p class="vazio" style="padding:20px">Carregando…</p>';
 try{const h=(await api('historico')).vendas;if(c.hidden)return;c.innerHTML=h.length?`<div class="lista">${h.map(v=>`<div class="item"><span class="n">${new Date(v.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<span class="mu sm" style="display:block;font-weight:400">${esc(v.itens.map(bonito).join(', '))}</span>${me.perm.compra&&v.linhas?.some(l=>cat?.some(p=>p.id===l.id&&p.estoque!=='esgotado'))?`<button class="denovo" data-denovo="${v.id}">↻ Comprar de novo</button>`:''}</span><b class="num">${brl(v.total)}</b></div>`).join('')}</div>`:'<p class="vazio" style="padding:20px">Nenhuma compra pelo app ainda.</p>';
  c.querySelectorAll('[data-denovo]').forEach(b=>b.onclick=()=>{const v=h.find(x=>x.id===b.dataset.denovo);let n=0,fora=0;for(const l of v.linhas){const p=cat.find(x=>x.id===l.id);if(!p||p.estoque==='esgotado'){fora++;continue}const x=carrinho.find(i=>i.id===l.id);if(x)x.q=Math.min(99,x.q+l.q);else carrinho.push({id:l.id,q:l.q});n+=l.q}salvarCar();toast(n+(n>1?' itens':' item')+' no carrinho'+(fora?` · ${fora} esgotado${fora>1?'s':''}`:''));aba='carrinho';render();window.scrollTo(0,0)})}catch(e){c.innerHTML=`<p class="vazio" style="padding:20px">${esc(e.message)}</p>`}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me){carregarPend().then(nav);if(aba==='pendentes')telaPend()}else pararCam()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
})();
</script>
