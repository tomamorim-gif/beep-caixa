<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beep · Minha loja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--k1:#141414;--k2:#1c1c1c;--k3:#262626;--line:#2c2c2c;--ink:#f5f5f5;--mu:#a1a1aa;--y:#ffd60a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
.logo{height:34px;width:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;font-weight:700;font-size:17px;width:100%;background:var(--k3);border:1px solid var(--line)}
.btn.y{background:var(--y);color:#111;border-color:var(--y)}.btn:disabled{opacity:.45}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}
.campo{display:grid;gap:6px;font-size:14px;color:var(--mu);font-weight:500}
.campo input{min-height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--k2);font-size:17px;color:var(--ink);outline:none;width:100%}
.campo input:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,10,.15)}
.pin{letter-spacing:.5em;text-align:center;font-size:24px!important;font-weight:700}
.card{background:var(--k1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.msg{color:#f87171;font-size:14px;min-height:20px}
.mu{color:var(--mu)}.sm{font-size:14px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--k2);border-radius:14px;padding:4px}.tabs2 button{min-height:44px;border-radius:11px;font-weight:600;color:var(--mu)}.tabs2 button.on{background:var(--k3);color:var(--ink)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.ola h1{font-size:22px}.ola p{color:var(--mu);font-size:14px}
.busca{position:relative;margin-bottom:12px}.busca input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--k2);padding:0 16px 0 44px;outline:none;font-size:16px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
.chips{display:flex;gap:8px;overflow:auto;margin-bottom:14px;scrollbar-width:none}.chips button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--k2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mu)}.chips button.on{background:var(--y);color:#111;border-color:var(--y)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:var(--k1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .foto{aspect-ratio:1;background:#fff;display:grid;place-items:center;padding:12px;position:relative}.prod .foto img{max-width:100%;max-height:100%;object-fit:contain}
.prod .foto.sem{background:linear-gradient(145deg,#1d1d1d,#121212);font:800 44px Manrope,Inter,sans-serif;color:var(--y)}
.prod.esg .foto{opacity:.45}
.prod .info{padding:10px 12px 12px;display:grid;gap:4px;flex:1}.prod .nome{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.prod .linha{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.prod .preco{font:800 17px Manrope,Inter,sans-serif;color:var(--y)}
.add{width:38px;height:38px;border-radius:12px;background:var(--y);color:#111;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none}
.est{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.est.tem{background:rgba(34,197,94,.9);color:#fff}.est.poucos{background:rgba(245,158,11,.95);color:#111}.est.esgotado{background:rgba(239,68,68,.92);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 10px;border-radius:12px;position:relative;min-width:62px}.nav button.on{color:var(--y)}
.badge{position:absolute;top:0;right:10px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.lista{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;background:var(--k1);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.th{width:54px;height:54px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--y);font:800 22px Manrope,Inter,sans-serif}.th.sem{background:#1d1d1d}.th img{max-width:100%;max-height:100%;object-fit:contain}
.item .n{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3}.item .n small{display:block;color:var(--y);font:800 15px Manrope,Inter,sans-serif;margin-top:2px}
.qtd{display:flex;align-items:center;gap:6px}.qtd button{width:36px;height:36px;border-radius:10px;background:var(--k3);font-weight:800;font-size:18px}.qtd b{min-width:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0}.total b{font:800 30px Manrope,Inter,sans-serif;color:var(--y)}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.forma{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--k2);display:grid;gap:4px;justify-items:center;font-weight:700}.forma.on{border-color:var(--y);background:rgba(255,214,10,.07)}
.vazio{text-align:center;color:var(--mu);padding:40px 16px}
.aviso{padding:12px 14px;border-radius:14px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fde68a;font-size:14px}
.ok-tela{min-height:70vh;display:grid;place-items:center;text-align:center;gap:12px;padding:20px}.ok-ic{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto}
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}.cam video{width:100%;height:100%;object-fit:cover}.cam .mira{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid var(--y);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#111;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.pend{border-left:4px solid var(--y)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>
<script>
(()=>{
const API='https://gdnvjpmpfgautrmtkjmx.supabase.co/functions/v1/cliente';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const semAc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const bonito=n=>String(n||'').toLowerCase().replace(/(^|[\s\-(\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());
let token=ls.get('bc-token',null),loja=ls.get('bc-loja',null),me=null,cat=ls.get('bc-cat',null),carrinho=ls.get('bc-carrinho',[]),aba='produtos',filtro='todos',busca='',pend=[];
async function api(acao,dados={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({acao,...dados})});let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&token&&!['entrar','cadastrar'].includes(acao)){token=null;ls.del('bc-token');telaEntrada('entrar','Sua sessão expirou. Entre de novo.');throw new Error('sessão')}
 if(!r.ok)throw new Error(j.erro||'Não foi possível concluir');return j}
const ICON={prod:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
 ler:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M14 8v8M17 8v8"/></svg>',
 pend:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3z"/><path d="M9 12h6M9 16h4"/></svg>',
 car:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></svg>',
 conta:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 lupa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'};
const foto=(p,cls)=>p.foto?`<span class="${cls}"><img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('sem');this.parentNode.textContent='${esc((p.nome||'?').trim().charAt(0).toUpperCase())}'"></span>`:`<span class="${cls} sem">${esc((p.nome||'?').trim().charAt(0).toUpperCase())}</span>`;

// ---------- loja pelo link (#l=ID) ----------
const m=location.hash.match(/l=([0-9a-f-]{36})/i);if(m){loja={id:m[1]};ls.set('bc-loja',loja);history.replaceState(null,'',location.pathname)}

// ---------- entrada: cadastro ou login ----------
function cpfFmt(v){v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
async function telaEntrada(modo,msg=''){$('#nav').style.display='none';
 if(!loja){$('#app').innerHTML=`<div class="ok-tela"><div><img class="logo" src="../logo.png" alt="Beep" style="height:44px"><h1 style="margin-top:24px;font-size:24px">Leia o QR code da sua loja</h1><p class="mu" style="margin-top:8px">O QR fica colado na loja do seu condomínio. Ele abre o app já na sua unidade.</p></div></div>`;return}
 if(!loja.nome){try{const r=await api('loja',{loja:loja.id});loja={id:loja.id,nome:r.loja.nome,empresa:r.empresa};ls.set('bc-loja',loja)}catch(e){$('#app').innerHTML=`<div class="ok-tela"><div><h1 style="font-size:22px">${esc(e.message)}</h1><p class="mu" style="margin-top:8px">Fale com o responsável pela loja.</p></div></div>`;return}}
 $('#app').innerHTML=`<img class="logo" src="../logo.png" alt="Beep"><div style="margin:22px 0 18px"><h1 style="font-size:26px">${modo==='cadastrar'?'Crie seu acesso':'Bem-vindo de volta'}</h1><p class="mu">Loja ${esc(loja.nome)}</p></div>
  <div class="tabs2" style="margin-bottom:16px"><button class="${modo==='cadastrar'?'on':''}" data-m="cadastrar">Primeiro acesso</button><button class="${modo==='entrar'?'on':''}" data-m="entrar">Já tenho cadastro</button></div>
  <form id="fEnt" class="card" style="display:grid;gap:14px">
   ${modo==='cadastrar'?`<label class="campo">Seu nome<input name="nome" autocomplete="name" required maxlength="80"></label><label class="campo">Casa ou apartamento<input name="unidade" placeholder="Ex.: Apto 302, Bloco B" required maxlength="30"></label>`:''}
   <label class="campo">CPF<input name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></label>
   <label class="campo">${modo==='cadastrar'?'Crie uma senha de 4 números':'Senha de 4 números'}<input name="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label>
   ${modo==='cadastrar'?'<label class="campo">Repita a senha<input name="pin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label>':''}
   <p class="msg" id="msg">${esc(msg)}</p><button class="btn y" type="submit">${modo==='cadastrar'?'Criar acesso':'Entrar'}</button>
   ${modo==='cadastrar'?'<p class="mu sm" style="text-align:center">Seu CPF é usado só para você entrar no app. Ele não fica visível para outras pessoas.</p>':''}
  </form>`;
 document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>telaEntrada(b.dataset.m));
 const cpf=$('#fEnt [name=cpf]');cpf.oninput=()=>{cpf.value=cpfFmt(cpf.value)};document.querySelectorAll('.pin').forEach(i=>i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,4)});
 $('#fEnt').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),bt=e.target.querySelector('button[type=submit]');$('#msg').textContent='';
  if(!/^\d{4}$/.test(f.pin)){$('#msg').textContent='A senha deve ter 4 números';return}if(modo==='cadastrar'&&f.pin!==f.pin2){$('#msg').textContent='As senhas não são iguais';return}
  bt.disabled=true;try{const r=await api(modo,{loja:loja.id,nome:f.nome,unidade:f.unidade,cpf:f.cpf,pin:f.pin});token=r.token;ls.set('bc-token',token);await iniciar()}catch(err){$('#msg').textContent=err.message;bt.disabled=false}}}

// ---------- app ----------
async function iniciar(){if(!token){telaEntrada(ls.get('bc-ja',false)?'entrar':'cadastrar');return}
 try{me=await api('me');ls.set('bc-ja',true);loja={...loja,id:me.loja.id,nome:me.loja.nome};ls.set('bc-loja',loja)}catch(e){if(e.message!=='sessão')telaErro(e.message);return}
 if(cat)render();await Promise.all([carregarCat(),carregarPend()]);render()}
async function carregarCat(){try{const r=await api('catalogo');cat=r.produtos;me.perm=r.perm;ls.set('bc-cat',cat);carrinho=carrinho.filter(i=>cat.some(p=>p.id===i.id));salvarCar()}catch(e){if(!cat)toast(e.message)}}
async function carregarPend(){if(!me?.perm?.pendente){pend=[];return}try{pend=(await api('pendentes')).vendas}catch(e){}}
function telaErro(t){$('#app').innerHTML=`<div class="ok-tela"><div><h1 style="font-size:22px">${esc(t)}</h1><button class="btn" style="margin-top:20px" onclick="location.reload()">Tentar de novo</button></div></div>`}
const salvarCar=()=>ls.set('bc-carrinho',carrinho);
const qtdCar=()=>carrinho.reduce((s,i)=>s+i.q,0),totCar=()=>carrinho.reduce((s,i)=>{const p=cat?.find(x=>x.id===i.id);return s+(p?p.preco*i.q:0)},0);
function nav(){const it=[['produtos','Produtos',ICON.prod],['ler','Ler código',ICON.ler]];if(me.perm.pendente)it.push(['pendentes','A pagar',ICON.pend,pend.length]);if(me.perm.compra)it.push(['carrinho','Carrinho',ICON.car,qtdCar()]);it.push(['conta','Conta',ICON.conta]);
 const n=$('#nav');n.style.display='flex';n.innerHTML=it.map(([k,t,ic,b])=>`<button class="${aba===k?'on':''}" data-a="${k}">${ic}${t}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{pararCam();aba=b.dataset.a;render();window.scrollTo(0,0)})}
function render(){if(!me)return;nav();({produtos:telaProdutos,ler:telaLer,pendentes:telaPend,carrinho:telaCarrinho,conta:telaConta})[aba]()}
function cabeca(t,sub){return `<div class="topo"><div class="ola"><h1>${t}</h1><p>${sub}</p></div><img class="logo" src="../logo.png" alt="Beep"></div>`}

function cardProd(p){const esg=p.estoque==='esgotado';return `<div class="prod ${esg?'esg':''}"><div class="foto${p.foto?'':' sem'}">${p.foto?`<img src="${esc(p.foto)}" alt="" loading="lazy">`:esc(p.nome.trim().charAt(0).toUpperCase())}<span class="est ${p.estoque}">${esg?'Esgotado':p.estoque==='poucos'?'Últimas unidades':'Disponível'}</span></div>
 <div class="info"><span class="nome">${esc(bonito(p.nome))}</span><div class="linha"><span class="preco num">${brl(p.preco)}</span>${me.perm.compra&&!esg?`<button class="add" data-add="${p.id}" aria-label="Adicionar ao carrinho">+</button>`:''}</div></div></div>`}
function telaProdutos(){const pr=(cat||[]).filter(p=>(filtro==='todos'||(filtro==='disp'?p.estoque!=='esgotado':p.estoque==='esgotado'))&&(!busca||semAc(p.nome).includes(semAc(busca))||p.codigos.includes(busca.trim())));
 $('#app').innerHTML=cabeca('Olá, '+esc((me.cliente.nome||'').split(' ')[0]),'Loja '+esc(me.loja.nome)+(me.perm.compra?' · compra pelo celular liberada':''))+
  `<div class="busca">${ICON.lupa}<input type="search" id="q" placeholder="Buscar produto" value="${esc(busca)}"></div>
  <div class="chips"><button class="${filtro==='todos'?'on':''}" data-f="todos">Todos (${(cat||[]).length})</button><button class="${filtro==='disp'?'on':''}" data-f="disp">Disponíveis</button><button class="${filtro==='esg'?'on':''}" data-f="esg">Esgotados</button></div>
  ${!cat?'<p class="vazio">Carregando produtos…</p>':pr.length?`<div class="grade">${pr.map(cardProd).join('')}</div>`:'<p class="vazio">Nenhum produto encontrado.</p>'}
  ${!me.perm.compra?'<p class="mu sm" style="text-align:center;margin-top:20px">Para comprar, use o caixa da loja.</p>':''}`;
 const q=$('#q');q.oninput=()=>{busca=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{telaProdutos();const n=$('#q');n.focus();n.setSelectionRange(busca.length,busca.length)},250)};
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;telaProdutos()});ligarAdd()}
function ligarAdd(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>adicionar(b.dataset.add))}
function adicionar(id){const p=cat.find(x=>x.id===id);if(!p)return;if(p.maior18&&!ls.get('bc-18',false)){if(!confirm('Este produto é para maiores de 18 anos. Você confirma que tem 18 anos ou mais?'))return;ls.set('bc-18',true)}
 const x=carrinho.find(i=>i.id===id);if(x)x.q=Math.min(99,x.q+1);else carrinho.push({id,q:1});salvarCar();navigator.vibrate?.(30);toast(bonito(p.nome)+' no carrinho');nav()}

// ---------- ler código ----------
let camStream=null,camLoop=null;
function pararCam(){if(camLoop)cancelAnimationFrame(camLoop);camLoop=null;camStream?.getTracks().forEach(t=>t.stop());camStream=null}
async function telaLer(){$('#app').innerHTML=cabeca('Ler código','Aponte a câmera para o código de barras do produto')+`<div class="cam"><video id="vid" playsinline muted></video><div class="mira"></div></div>
  <div class="busca" style="margin-top:14px">${ICON.lupa}<input id="codMan" inputmode="numeric" placeholder="Ou digite o código de barras"></div><div id="res" style="margin-top:12px"></div>`;
 $('#codMan').onchange=e=>mostrarCod(e.target.value.trim());
 if(!('BarcodeDetector' in window)){$('#res').innerHTML='<p class="mu sm">Este celular não lê código pela câmera. Digite o número que fica embaixo das barras.</p>';$('.cam').style.display='none';return}
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=camStream;await v.play();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});let ult='';
  const loop=async()=>{if(!camStream)return;try{const r=await det.detect(v);if(r[0]&&r[0].rawValue!==ult){ult=r[0].rawValue;navigator.vibrate?.(40);mostrarCod(ult)}}catch(e){}camLoop=requestAnimationFrame(()=>setTimeout(loop,180))};loop()}
 catch(e){$('.cam').style.display='none';$('#res').innerHTML='<p class="mu sm">Não consegui abrir a câmera. Libere a câmera para este site ou digite o código.</p>'}}
function mostrarCod(c){const nz=x=>String(x).replace(/\D/g,'').replace(/^0+/,'');const p=(cat||[]).find(x=>x.codigos.some(k=>nz(k)===nz(c)));
 $('#res').innerHTML=p?`<div class="item">${foto(p,'th')}<span class="n">${esc(bonito(p.nome))}<small class="num">${brl(p.preco)}</small><span class="mu sm" style="display:block;font-weight:500">${p.estoque==='esgotado'?'Esgotado nesta loja':p.estoque==='poucos'?'Últimas unidades':'Disponível'}</span></span>${me.perm.compra&&p.estoque!=='esgotado'?`<button class="add" data-add="${p.id}" aria-label="Adicionar ao carrinho">+</button>`:''}</div>`:`<div class="aviso">O código ${esc(c)} não está à venda nesta loja.</div>`;ligarAdd()}

// ---------- carrinho e pagamento ----------
let formaSel='pix';
function telaCarrinho(){const itens=carrinho.map(i=>({...i,p:cat.find(x=>x.id===i.id)})).filter(i=>i.p);
 $('#app').innerHTML=cabeca('Carrinho','Pague aqui mesmo, antes de sair da loja')+(itens.length?`<div class="lista">${itens.map(i=>`<div class="item">${foto(i.p,'th')}<span class="n">${esc(bonito(i.p.nome))}<small class="num">${brl(i.p.preco*i.q)}</small></span><span class="qtd"><button data-d="-1" data-id="${i.id}" aria-label="Menos">−</button><b class="num">${i.q}</b><button data-d="1" data-id="${i.id}" aria-label="Mais">+</button></span></div>`).join('')}</div>
  <div class="total"><span class="mu">Total</span><b class="num">${brl(totCar())}</b></div>${blocoPagar()}<button class="btn y" id="pagar">Pagar ${brl(totCar())}</button>`:'<p class="vazio">Seu carrinho está vazio.<br>Adicione produtos pela lista ou lendo o código.</p>');
 document.querySelectorAll('.qtd button').forEach(b=>b.onclick=()=>{const x=carrinho.find(i=>i.id===b.dataset.id);x.q+= +b.dataset.d;if(x.q<=0)carrinho=carrinho.filter(i=>i!==x);salvarCar();render()});
 ligarFormas();const bp=$('#pagar');if(bp)bp.onclick=()=>pagar(null)}
function blocoPagar(){return `<div class="formas"><button class="forma ${formaSel==='pix'?'on':''}" data-forma="pix"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l4.5 4.5L12 11 7.5 6.5zM12 13l4.5 4.5L12 22l-4.5-4.5zM2 12l4.5-4.5L11 12l-4.5 4.5zM13 12l4.5-4.5L22 12l-4.5 4.5z"/></svg>Pix</button><button class="forma ${formaSel==='cartao'?'on':''}" data-forma="cartao"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Cartão</button></div>${me.pagamento_teste?'<div class="aviso" style="margin-bottom:12px">Modo de teste: nenhum valor é cobrado de verdade.</div>':''}`}
function ligarFormas(){document.querySelectorAll('[data-forma]').forEach(b=>b.onclick=()=>{formaSel=b.dataset.forma;document.querySelectorAll('[data-forma]').forEach(x=>x.classList.toggle('on',x===b))})}
async function pagar(vendaId){const bt=vendaId?document.querySelector(`[data-pagar="${vendaId}"]`):$('#pagar');if(bt){bt.disabled=true;bt.textContent='Processando…'}
 try{const r=vendaId?await api('pagar',{venda_id:vendaId,forma:formaSel}):await api('pagar',{id:ls.get('bc-pedido',null)||(ls.set('bc-pedido',uuid()),ls.get('bc-pedido')),forma:formaSel,itens:carrinho.map(i=>({produto_id:i.id,quantidade:i.q}))});
  if(!vendaId){carrinho=[];salvarCar();ls.del('bc-pedido')}navigator.vibrate?.([60,40,60]);
  $('#app').innerHTML=`<div class="ok-tela"><div><div class="ok-ic"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div><h1 style="font-size:28px;margin-top:20px">Pago!</h1><p class="num" style="font:800 26px Manrope,Inter,sans-serif;color:var(--y);margin-top:6px">${brl(r.total)}</p><p class="mu" style="margin-top:6px">${new Date().toLocaleString('pt-BR')} · ${formaSel==='pix'?'Pix':'Cartão'} · Loja ${esc(me.loja.nome)}</p>${r.teste?'<p class="mu sm" style="margin-top:10px">Pagamento de teste: nada foi cobrado.</p>':''}<button class="btn" style="margin-top:24px" id="okVolta">Voltar aos produtos</button></div></div>`;
  $('#okVolta').onclick=()=>{aba='produtos';render()};await Promise.all([carregarCat(),carregarPend()]);nav()}
 catch(e){toast(e.message);if(bt){bt.disabled=false;bt.textContent='Pagar'}}}

// ---------- vendas travadas ----------
async function telaPend(){$('#app').innerHTML=cabeca('A pagar','Compras que a loja registrou para você')+(pend.length?`<div class="lista">${pend.map(v=>`<div class="card pend"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Compra de ${new Date(v.criada_em).toLocaleDateString('pt-BR')}</b><b class="num" style="color:var(--y);font:800 20px Manrope,Inter,sans-serif">${brl(v.total)}</b></div><div class="mu sm" style="margin:8px 0 12px">${v.itens.map(i=>`${i.quantidade}× ${esc(bonito(i.nome))}`).join('<br>')}</div><button class="btn y" data-pagar="${v.id}">Pagar ${brl(v.total)}</button></div>`).join('')}</div><div style="margin-top:14px">${blocoPagar()}</div>`:'<p class="vazio">Nada para pagar. Tudo certo!</p>');
 ligarFormas();document.querySelectorAll('[data-pagar]').forEach(b=>b.onclick=()=>pagar(b.dataset.pagar))}

// ---------- conta ----------
async function telaConta(){$('#app').innerHTML=cabeca('Minha conta','Loja '+esc(me.loja.nome))+`<div class="card" style="display:grid;gap:6px"><b style="font-size:18px">${esc(me.cliente.nome)}</b><span class="mu">${esc(me.cliente.unidade)} · CPF ${esc(me.cliente.cpf)}</span>
  <span class="mu sm" style="margin-top:6px">${me.perm.compra?'✓ Compra pelo celular liberada':'Compras no caixa da loja'}${me.perm.pendente?' · ✓ Pagamento de compras registradas':''}</span></div>
  <h2 style="font-size:18px;margin:22px 0 10px">Últimas compras</h2><div id="hist" class="lista"><p class="vazio">Carregando…</p></div>
  <button class="btn" style="margin-top:22px" id="sair">Sair deste celular</button>`;
 $('#sair').onclick=async()=>{try{await api('sair')}catch(e){}token=null;me=null;ls.del('bc-token');ls.del('bc-cat');ls.del('bc-carrinho');cat=null;carrinho=[];telaEntrada('entrar')};
 try{const h=(await api('historico')).vendas;$('#hist').innerHTML=h.length?h.map(v=>`<div class="item"><span class="n">${new Date(v.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<span class="mu sm" style="display:block;font-weight:400">${esc(v.itens.map(bonito).join(', '))}</span></span><b class="num">${brl(v.total)}</b></div>`).join(''):'<p class="vazio">Nenhuma compra pelo app ainda.</p>'}catch(e){$('#hist').innerHTML=''}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me){carregarPend().then(nav);if(aba==='pendentes')telaPend()}else pararCam()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
})();
</script>
</body>
</html>
