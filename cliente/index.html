<style>

.ver-car{width:100%;height:44px;border-radius:12px;background:var(--y);color:#111;font-weight:800;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#111;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}

.aceite{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mu);line-height:1.45;cursor:pointer}.aceite input{width:22px;height:22px;accent-color:var(--y);flex:none;margin-top:1px}.aceite a,.lnk{color:var(--ink);font-weight:600}
.fav{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#9ca3af;box-shadow:0 1px 4px rgba(0,0,0,.12)}.fav.on{color:#ef4444}.fav svg{width:19px;height:19px}
.prod .linha{flex-wrap:wrap}.avisar{width:100%;justify-content:center;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--k2);font-size:12.5px;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--ink);flex:none}.avisar.on{border-color:rgba(var(--yr),.5);color:var(--y);background:rgba(var(--yr),.08)}.avisar svg{width:15px;height:15px}

.ad .txt .lin{display:flex;align-items:center;gap:8px;min-width:0}.ad .txt .lin>span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.cupom{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.6);color:#fff;font:700 12.5px Inter,sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:8px;width:max-content}
.selo.casa{background:var(--y);color:#111}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--y);color:#111;display:grid;place-items:center;font:800 22px Manrope,Inter,sans-serif;flex:none}
.dobras{margin-top:14px;display:grid;gap:10px}.dobra{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;padding:0 16px;border-radius:16px;background:var(--k1);border:1px solid var(--line);font-weight:600;font-size:16px;text-align:left}
.dobra span{display:flex;align-items:center;gap:12px}.dobra svg{width:20px;height:20px;color:var(--mu)}.dobra i{font-style:normal;font-size:24px;color:var(--mu);transition:transform .2s}.dobra[aria-expanded=true] i{transform:rotate(90deg)}.dobra[aria-expanded=true]{border-color:#3a3a3a}
.dobra-c{margin-top:-4px}.linha-d{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}.linha-d:last-child{border:0}.linha-d span{color:var(--mu)}.linha-d b{text-align:right;font-weight:600}
.dobra-c:has(.linha-d){background:var(--k1);border:1px solid var(--line);border-radius:16px}
.denovo{margin-top:8px;height:38px;border-radius:11px;background:var(--k3);border:1px solid var(--line);font-weight:700;font-size:13.5px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
/* anúncios de parceiros */
.ads{position:relative;margin:0 -18px 16px;overflow:hidden}
.ads-trilho{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scroll-padding:0 18px;scrollbar-width:none}.ads-trilho::-webkit-scrollbar{display:none}
.ad{position:relative;flex:0 0 100%;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--k2);aspect-ratio:16/9;border:1px solid var(--line);text-align:left;display:block;width:100%}
.ad img,.ad video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad .vel{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}
.ad .txt{position:absolute;left:14px;right:14px;bottom:12px;display:grid;gap:2px}
.ad .txt b{font:800 18px/1.2 Manrope,Inter,sans-serif;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad .txt span{font-size:13px;color:rgba(255,255,255,.82);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ad .cta{position:absolute;right:12px;top:12px;background:var(--y);color:#111;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
.selo{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:8px}
.ads-pontos{display:flex;justify-content:center;gap:6px;margin-top:10px}.ads-pontos i{width:6px;height:6px;border-radius:3px;background:var(--k3);transition:.25s}.ads-pontos i.on{width:18px;background:var(--y)}
.ad-grade{grid-column:1/-1;aspect-ratio:2/1}
.ad-ok{margin-top:22px;aspect-ratio:16/9;width:100%}
/* contingência, Pix e 18+ */
.cont{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(var(--yr),.16),rgba(var(--yr),.05));border:1px solid rgba(var(--yr),.4);margin-bottom:14px}
.cont .ic{width:36px;height:36px;border-radius:11px;background:var(--y);color:#111;display:grid;place-items:center;flex:none}.cont .ic svg{width:20px;height:20px}
.cont b{display:block;font-size:15px}.cont span{font-size:13.5px;color:#e7e5d8;line-height:1.4}
.forma-pix{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;border:2px solid var(--y);background:rgba(var(--yr),.07);margin-bottom:12px}
.forma-pix svg{flex:none;color:var(--y)}.forma-pix b{display:block;font-size:16px}.forma-pix small{color:var(--mu);font-size:13px}
.pix{display:grid;gap:14px}
.pix-valor{display:flex;justify-content:space-between;align-items:baseline}.pix-valor b{font:800 30px Manrope,Inter,sans-serif;color:var(--y)}
.pix-qr{width:min(64vw,240px);aspect-ratio:1;margin:0 auto;background:#fff;border-radius:18px;padding:12px;display:grid;place-items:center}.pix-qr img{width:100%;height:100%;image-rendering:pixelated}
.pix-passos{list-style:none;padding:0;display:grid;gap:8px}.pix-passos li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;font-size:14.5px;color:#d4d4d8}
.pix-passos li i{width:28px;height:28px;border-radius:9px;background:var(--k3);color:var(--y);font:800 14px Manrope,Inter,sans-serif;font-style:normal;display:grid;place-items:center}
.pix-st{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;color:var(--mu);min-height:24px}
.giro{width:18px;height:18px;border-radius:50%;border:3px solid var(--k3);border-top-color:var(--y);animation:giro 1s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:3s}}
.verde{position:fixed;inset:0;z-index:30;background:var(--ok);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
.verde .marca{width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:8px}
.verde h1{font-size:34px}.verde .val{font:800 30px Manrope,Inter,sans-serif}.verde p{opacity:.9}
.verde .btn{background:#fff;color:#0b0b0b;border-color:#fff;max-width:420px;margin-top:18px}.verde .ad-ok{max-width:420px}

.m18-selo{width:64px;height:64px;border-radius:50%;border:4px solid var(--bad);color:var(--bad);font:800 26px Manrope,Inter,sans-serif;display:grid;place-items:center;margin:0 auto 4px}
.m18-box h2{font-size:21px}.m18-box .prod18{color:var(--y);font-weight:700}.m18-box .lei{font-size:13px;color:var(--mu);line-height:1.45}
</style>

<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>
<script>
(()=>{
const API='https://gdnvjpmpfgautrmtkjmx.supabase.co/functions/v1/cliente',API_PAG=API.replace(/\/cliente$/,'/cartao');
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>((c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const semAc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const bonito=n=>String(n||'').toLowerCase().replace(/(^|[\s\-(\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());
let token=ls.get('bc-token',null),loja=ls.get('bc-loja',null),me=null,cat=ls.get('bc-cat',null),carrinho=ls.get('bc-carrinho',[]),aba='produtos',filtro='todos',busca='',pend=[];
// caixa cujo QR o cliente leu: se ele estiver sem internet, a compra pelo celular é liberada (vale por 3 h)
const caixaQr=()=>{const c=ls.get('bc-caixa',null);return c&&Date.now()-c.em<3*3600e3?c.id:undefined};
async function api(acao,dados={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({acao,caixa:caixaQr(),...dados})});let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&token&&!['entrar','cadastrar'].includes(acao)){token=null;ls.del('bc-token');telaEntrada('entrar','Sua sessão expirou. Entre de novo.');throw new Error('sessão')}
 if(!r.ok)throw new Error(j.erro||'Não foi possível concluir');return j}
async function apiPag(acao,dados={}){const r=await fetch(API_PAG,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({acao,caixa:caixaQr(),...dados})});let j={};try{j=await r.json()}catch(e){}

function pedir18(nome){return new Promise(res=>{const d=document.createElement('div');d.className='m18';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
 d.innerHTML=`<div class="m18-box"><div class="m18-selo" aria-hidden="true">18</div><h2>Produto para maiores de 18 anos</h2>${nome?`<p class="prod18">${esc(bonito(nome))}</p>`:''}<p class="lei">Vender, fornecer ou entregar bebida alcoólica a menores de 18 anos é crime (art. 243 do Estatuto da Criança e do Adolescente). Ao confirmar, você declara ter 18 anos ou mais.</p><button class="btn y" data-r="1">Confirmo: tenho 18 anos ou mais</button><button class="btn" data-r="0">Não tenho 18 anos</button></div>`;
 document.body.appendChild(d);d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{d.remove();const ok=b.dataset.r==='1';if(!ok)toast('Este produto não pode ser vendido para menores de 18 anos');res(ok)})})}
async function adicionar(id){const p=cat.find(x=>x.id===id);if(!p)return;if(p.maior18&&!ls.get('bc-18em',null)){if(!await pedir18(p.nome))return;ls.set('bc-18em',new Date().toISOString())}
 const x=carrinho.find(i=>i.id===id);if(x)x.q=Math.min(99,x.q+1);else carrinho.push({id,q:1});salvarCar();navigator.vibrate?.(30);toast(bonito(p.nome)+' no carrinho');nav()}

// ---------- ler código ----------
// Leitor pela câmera: usa o leitor do próprio celular (Android) e, onde não existe (iPhone), um leitor embutido.
// Só aceita código com dígito verificador certo e lido 2 vezes seguidas: acaba com leitura errada
// ("não está à venda") de código lido pela metade. Lê só a faixa da mira, em alta resolução.
let camStream=null,camLoop=null,camGen=0,detector=null,lerOcupado=false,ult='',falta=0,ultRes=null;
function pararCam(){camGen++;if(camLoop)clearTimeout(camLoop);camLoop=null;camStream?.getTracks().forEach(t=>t.stop());camStream=null}
const soNum=x=>String(x).replace(/\D/g,'');
const nzCod=x=>soNum(x).replace(/^0+/,'');
function gtinOk(c){if(!/^(\d{8}|\d{12,14})$/.test(c))return false;const d=c.split('').reverse().map(Number);let s=0;for(let i=1;i<d.length;i++)s+=d[i]*(i%2?3:1);return (10-s%10)%10===d[0]}
async function obterDetector(){if(detector)return detector;const F=['ean_13','ean_8','upc_a'];
 if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=F.filter(x=>sup.includes(x));if(f.length)return detector=new BarcodeDetector({formats:f})}catch(e){}}
 if(!window.BarcodeDetectionAPI)await new Promise((ok,er)=>{const sc=document.createElement('script');sc.src='vendor/barcode-detector.js';sc.onload=ok;sc.onerror=er;document.head.appendChild(sc)});
 const A=window.BarcodeDetectionAPI;A.prepareZXingModule({overrides:{locateFile:(f,pre)=>f.endsWith('.wasm')?new URL('vendor/zxing_reader.wasm',location.href).href:pre+f},fireImmediately:true});
 return detector=new A.BarcodeDetector({formats:F})}
async function telaLer(){pararCam();const gen=camGen;$('#app').innerHTML=cabeca('Ler código','Aponte a câmera para o código de barras, dentro da faixa amarela')+faixaCont()+`<div class="cam"><video id="vid" playsinline muted></video><div class="mira"><span class="laser"></span></div><button class="luz" id="luz" hidden aria-label="Lanterna">Lanterna</button><p class="cam-msg" id="camMsg">Abrindo a câmera…</p></div>
  <div id="res" style="margin-top:12px"></div><div class="busca" style="margin-top:12px">${ICON.lupa}<input id="codMan" inputmode="numeric" enterkeyhint="search" placeholder="Ou digite o código de barras"></div>`;
 if(ultRes&&Date.now()-ultRes.t<20000){$('#res').innerHTML=ultRes.h;$('#verCar')&&($('#verCar').onclick=verCarrinho)}
 $('#codMan').onchange=e=>{const c=soNum(e.target.value);if(c){aceitarCod(c,true);e.target.value=''}};
 let det;try{det=await obterDetector()}catch(e){if(gen===camGen)semCamera('Este celular não lê código pela câmera. Digite o número que fica embaixo das barras.');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})}
 catch(e){if(gen===camGen)semCamera('Não consegui abrir a câmera. Libere a câmera para este site nas configurações do navegador ou digite o código.');return}
 if(aba!=='ler'||gen!==camGen){st.getTracks().forEach(t=>t.stop());return}
 camStream=st;
 const v=$('#vid');v.srcObject=camStream;try{await v.play()}catch(e){}
 const tr=camStream.getVideoTracks()[0],cap=tr.getCapabilities?.()||{};
 try{if(cap.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
 if(cap.torch){const b=$('#luz');b.hidden=false;let on=false;b.onclick=async()=>{on=!on;try{await tr.applyConstraints({advanced:[{torch:on}]});b.classList.toggle('on',on)}catch(e){}}}
 $('#camMsg').textContent='Aproxime o código da faixa amarela';
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let cand='',vezes=0;
 const loop=async()=>{if(gen!==camGen||!camStream||aba!=='ler')return;
  if(!lerOcupado&&v.videoWidth){try{
   // recorta só a faixa da mira (o vídeo aparece cortado na tela: object-fit cover)
   const box=v.getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight,esc_=Math.max(box.width/vw,box.height/vh),sw=box.width/esc_,sh=box.height/esc_,sx=(vw-sw)/2,sy=(vh-sh)/2;
   const x=sx+sw*.04,y=sy+sh*.3,w=sw*.92,h=sh*.4;cv.width=Math.min(1280,Math.round(w));cv.height=Math.round(h*cv.width/w);cx.drawImage(v,x,y,w,h,0,0,cv.width,cv.height);
   const r=await det.detect(cv);const c=r.map(b=>soNum(b.rawValue)).find(gtinOk);
   // o mesmo produto só entra de novo depois de sair da frente da câmera (evita somar sem querer)
   if(c!==ult){if(++falta>=4)ult=''}else falta=0;
   if(c&&c!==ult){if(c===cand)vezes++;else{cand=c;vezes=1}
    if(vezes>=2){ult=c;falta=0;vezes=0;cand='';await aceitarCod(c,false)}}
  }catch(e){}}
  if(gen===camGen)camLoop=setTimeout(loop,120)};loop()}
function semCamera(t){pararCam();const c=$('.cam');if(c)c.style.display='none';$('#res').innerHTML=`<p class="mu sm">${t}</p>`;$('#codMan')?.focus()}
async function aceitarCod(c,manual){const p=(cat||[]).find(x=>x.codigos.some(k=>nzCod(k)===nzCod(c)));
 if(!p){navigator.vibrate?.([80,60,80]);$('#res').innerHTML=`<div class="aviso">O código ${esc(c)} não foi encontrado nesta loja.${manual?' Confira o número.':' Tente de novo ou digite o número.'}</div>`;return}
 navigator.vibrate?.(40);const selo=p.estoque==='poucos'?'<span class="mu sm" style="display:block;font-weight:500">Últimas unidades</span>':'';
 if(!me.perm.compra){$('#res').innerHTML=`<div class="item">${foto(p,'th')}<span class="n">${esc(bonito(p.nome))}<small class="num">${brl(p.preco)}</small>${selo}</span></div>`;return}
 lerOcupado=true;const antes=qtdCar();try{await adicionar(p.id)}finally{lerOcupado=false}
 if(qtdCar()===antes){$('#res').innerHTML='';return}
 const q=carrinho.find(i=>i.id===p.id)?.q||1;
 $('#res').innerHTML=`<div class="item lido">${foto(p,'th')}<span class="n">${esc(bonito(p.nome))}<small class="num">${brl(p.preco)}${q>1?` · ${q} no carrinho`:''}</small><span class="ok-sm">✓ No carrinho</span></span><button class="ver-car" id="verCar">Ver carrinho · ${brl(totCar())}</button></div>`;
 ultRes={h:$('#res').innerHTML,t:Date.now()};$('#verCar').onclick=verCarrinho}
function verCarrinho(){pararCam();ultRes=null;aba='carrinho';render();window.scrollTo(0,0)}
const mostrarCod=c=>aceitarCod(soNum(c),true);

// ---------- carrinho e pagamento ----------
let formaSel='pix';
function telaCarrinho(){const itens=carrinho.map(i=>({...i,p:cat.find(x=>x.id===i.id)})).filter(i=>i.p);
 $('#app').innerHTML=cabeca('Carrinho','Pague aqui mesmo, antes de sair da loja')+faixaCont()+(itens.length?`<div class="lista">${itens.map(i=>`<div class="item">${foto(i.p,'th')}<span class="n">${esc(bonito(i.p.nome))}<small class="num">${brl(i.p.preco*i.q)}</small></span><span class="qtd"><button data-d="-1" data-id="${i.id}" aria-label="Menos">−</button><b class="num">${i.q}</b><button data-d="1" data-id="${i.id}" aria-label="Mais">+</button></span></div>`).join('')}</div>
  <div class="total"><span class="mu">Total</span><b class="num">${brl(totCar())}</b></div>${blocoPagar()}<button class="btn y" id="pagar">Pagar ${brl(totCar())}</button>`:'<p class="vazio">Seu carrinho está vazio.<br>Adicione produtos pela lista ou lendo o código.</p>');
 document.querySelectorAll('.qtd button').forEach(b=>b.onclick=()=>{const x=carrinho.find(i=>i.id===b.dataset.id);x.q+= +b.dataset.d;if(x.q<=0)carrinho=carrinho.filter(i=>i!==x);if(!carrinho.some(i=>cat.find(p=>p.id===i.id)?.maior18))ls.del('bc-18em');salvarCar();render()});
 ligarFormas();const bp=$('#pagar');if(bp)bp.onclick=()=>pagar(null)}
function blocoPagar(){return `<div class="forma-pix">${ICON.pix}<span><b>Pix</b><small>Pague pelo app do seu banco. A confirmação chega aqui na hora.</small></span></div>`}
function ligarFormas(){}
let pixLoop=null,emPix=false;
async function pagar(vendaId){const bt=vendaId?document.querySelector(`[data-pagar="${vendaId}"]`):$('#pagar'),txt=bt?.textContent;
 const v=vendaId?pend.find(x=>x.id===vendaId):null;
 if(!vendaId&&!me.perm.compra){toast('A compra pelo celular não está liberada agora. Pague no caixa da loja.');render();return}
 const tem18=vendaId?!!v?.maior18:carrinho.some(i=>cat.find(p=>p.id===i.id)?.maior18);
 let m18=vendaId?null:ls.get('bc-18em',null);
 if(tem18&&!m18){if(!await pedir18(null))return;m18=new Date().toISOString();if(!vendaId)ls.set('bc-18em',m18)}
 if(bt){bt.disabled=true;bt.textContent='Gerando o Pix…'}
 try{let pedido=null;if(!vendaId){pedido=ls.get('bc-pedido',null);if(!pedido){pedido=uuid();ls.set('bc-pedido',pedido)}}
  const r=await apiPag('app_pix',vendaId?{venda_id:vendaId,maior18_em:m18}:{pedido,maior18_em:m18,itens:carrinho.map(i=>({produto_id:i.id,quantidade:i.q}))});
  if(r.status==='aprovado'){pago(r.total,vendaId);return}
  const px={cobranca:r.cobranca,qr:r.pix_qr||null,img:r.pix_qr_img||null,total:r.total,venda:vendaId||null,desde:Date.now()};ls.set('bc-pix',px);telaPix(px)}
 catch(e){if(e.status===428)ls.del('bc-18em');if(e.message!=='sessão')toast(e.message);if(bt){bt.disabled=false;bt.textContent=txt}}}
function telaPix(px){emPix=true;clearTimeout(pixLoop);$('#nav').style.display='none';window.scrollTo(0,0);
 $('#app').innerHTML=cabeca('Pague com Pix','Loja '+esc(me.loja.nome))+`<div class="pix"><div class="card pix-valor"><span class="mu">Total</span><b class="num">${brl(px.total)}</b></div>
  ${px.qr?`<button class="btn y" id="pixCopiar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar código Pix</button>`:''}
  <ol class="pix-passos"><li><i>1</i><span>Copie o código Pix</span></li><li><i>2</i><span>No app do seu banco, escolha <b>Pix copia e cola</b> e cole o código</span></li><li><i>3</i><span>Volte para cá: a confirmação aparece sozinha</span></li></ol>
  ${px.img?`<div class="pix-qr"><img alt="QR code do Pix" src="data:image/png;base64,${px.img}"></div><p class="mu sm" style="text-align:center">Ou leia este QR com outro celular</p>`:''}
  <p class="pix-st" id="pixSt"><span class="giro" aria-hidden="true"></span>Aguardando o pagamento…</p>
  <button class="btn" id="pixCancelar">Cancelar Pix</button></div>`;
 const cp=$('#pixCopiar');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(px.qr);toast('Código Pix copiado. Cole no app do seu banco.');cp.lastChild.textContent='Código copiado'}catch(e){prompt('Copie o código Pix:',px.qr)}};
 $('#pixCancelar').onclick=()=>cancelarPix(px,'Pix cancelado');
 const passo=async()=>{if(!emPix)return;if(Date.now()-px.desde>15*60000){cancelarPix(px,'Tempo esgotado: o Pix foi cancelado');return}
  try{const r=await apiPag('app_status',{cobranca:px.cobranca});
   if(r.status==='aprovado'&&r.venda_gravada){pago(r.total,px.venda);return}
   if(['recusado','cancelado','expirado','estornado','falhou'].includes(r.status)){fimPix(r.mensagem||'O Pix não foi concluído');return}}
  catch(e){if(e.status===404){fimPix('Pagamento não encontrado');return}}
  pixLoop=setTimeout(passo,3000)};
 pixLoop=setTimeout(passo,2500);pixPasso=passo}
let pixPasso=null;
async function cancelarPix(px,msg){const b=$('#pixCancelar');if(b){b.disabled=true;b.textContent='Cancelando…'}
 try{const r=await apiPag('app_cancelar',{cobranca:px.cobranca});if(r.status==='aprovado'){if(r.venda_gravada)pago(r.total,px.venda);return}}catch(e){if(e.status!==404){toast('Não consegui cancelar agora. Tente de novo.');if(b){b.disabled=false;b.textContent='Cancelar Pix'}return}}
 fimPix(msg)}
function fimPix(msg){emPix=false;clearTimeout(pixLoop);ls.del('bc-pix');toast(msg);render()}
function pago(total,vendaId){emPix=false;clearTimeout(pixLoop);ls.del('bc-pix');if(!vendaId){carrinho=[];salvarCar();ls.del('bc-pedido');ls.del('bc-18em')}navigator.vibrate?.([60,40,60]);$('#nav').style.display='none';
 $('#app').innerHTML=`<div class="verde" role="status"><div class="marca"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div><h1>Compra paga</h1><p class="val num">${brl(total)}</p><p>${new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · Pix · Loja ${esc(me.loja.nome)}</p><p style="font-weight:600">Pode levar seus produtos</p><button class="btn" id="okVolta">Voltar aos produtos</button>${ads.length?adHtml(ads[0],0,'ad-ok'):''}</div>`;
 $('#okVolta').onclick=()=>{aba='produtos';render()};ligarAds();Promise.all([carregarCat(),carregarPend()]).catch(()=>{})}

// ---------- vendas travadas ----------
async function telaPend(){$('#app').innerHTML=cabeca('A pagar','Compras que a loja registrou para você')+(pend.length?`<div class="lista">${pend.map(v=>`<div class="card pend"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Compra de ${new Date(v.criada_em).toLocaleDateString('pt-BR')}</b><b class="num" style="color:var(--y);font:800 20px Manrope,Inter,sans-serif">${brl(v.total)}</b></div><div class="mu sm" style="margin:8px 0 12px">${v.itens.map(i=>`${i.quantidade}× ${esc(bonito(i.nome))}`).join('<br>')}</div><button class="btn y" data-pagar="${v.id}">Pagar ${brl(v.total)}</button></div>`).join('')}</div><div style="margin-top:14px">${blocoPagar()}</div>`:'<p class="vazio">Nada para pagar. Tudo certo!</p>');
 ligarFormas();document.querySelectorAll('[data-pagar]').forEach(b=>b.onclick=()=>pagar(b.dataset.pagar))}

// ---------- conta ----------
async function telaConta(){$('#app').innerHTML=cabeca('Minha conta','Loja '+esc(me.loja.nome))+`<div class="card" style="display:flex;align-items:center;gap:14px"><span class="avatar">${esc((me.cliente.nome||'?').trim().charAt(0).toUpperCase())}</span><span style="min-width:0"><b style="font-size:18px;display:block">${esc((me.cliente.nome||'').split(' ')[0])}</b><span class="mu sm">${esc(me.cliente.unidade)}</span></span></div>
  <div class="dobras"><button class="dobra" data-dobra="dados" aria-expanded="false"><span>${ICON.conta}Dados do cadastro</span><i>›</i></button><div class="dobra-c" id="dc-dados" hidden></div>
  <button class="dobra" data-dobra="hist" aria-expanded="false"><span>${ICON.pend}Histórico de compras</span><i>›</i></button><div class="dobra-c" id="dc-hist" hidden></div></div>
  <button class="btn" style="margin-top:22px" id="sair">Sair deste celular</button>
  <p class="mu sm" style="text-align:center;margin-top:16px"><a class="lnk" href="../termos/" target="_blank">Termos de uso e privacidade</a> · Para excluir seu cadastro, <a class="lnk" href="../termos/#contato" target="_blank">fale com a loja</a></p>`;
 $('#sair').onclick=async()=>{try{await api('sair')}catch(e){}token=null;me=null;ls.del('bc-token');ls.del('bc-cat');ls.del('bc-carrinho');cat=null;carrinho=[];telaEntrada('entrar')};
 document.querySelectorAll('[data-dobra]').forEach(b=>b.onclick=()=>{const k=b.dataset.dobra,c=$('#dc-'+k),abrir=c.hidden;c.hidden=!abrir;b.setAttribute('aria-expanded',abrir);if(!abrir){c.innerHTML='';return}
  if(k==='dados'){c.innerHTML=`<div class="linha-d"><span>Nome</span><b>${esc(me.cliente.nome)}</b></div><div class="linha-d"><span>Unidade</span><b>${esc(me.cliente.unidade)}</b></div><div class="linha-d"><span>CPF</span><b>${esc(me.cliente.cpf)}</b></div><div class="linha-d"><span>Compra pelo celular</span><b>${me.perm.contingencia?'Liberada (caixa sem internet)':me.perm.compra?'Liberada':'No caixa da loja'}</b></div>`;return}
  carregarHist(c)})}
async function carregarHist(c){c.innerHTML='<p class="vazio" style="padding:20px">Carregando…</p>';
 try{const h=(await api('historico')).vendas;if(c.hidden)return;c.innerHTML=h.length?`<div class="lista">${h.map(v=>`<div class="item"><span class="n">${new Date(v.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<span class="mu sm" style="display:block;font-weight:400">${esc(v.itens.map(bonito).join(', '))}</span>${me.perm.compra&&v.linhas?.some(l=>cat?.some(p=>p.id===l.id&&p.estoque!=='esgotado'))?`<button class="denovo" data-denovo="${v.id}">↻ Comprar de novo</button>`:''}</span><b class="num">${brl(v.total)}</b></div>`).join('')}</div>`:'<p class="vazio" style="padding:20px">Nenhuma compra pelo app ainda.</p>';
  c.querySelectorAll('[data-denovo]').forEach(b=>b.onclick=()=>{const v=h.find(x=>x.id===b.dataset.denovo);let n=0,fora=0;for(const l of v.linhas){const p=cat.find(x=>x.id===l.id);if(!p||p.estoque==='esgotado'){fora++;continue}const x=carrinho.find(i=>i.id===l.id);if(x)x.q=Math.min(99,x.q+l.q);else carrinho.push({id:l.id,q:l.q});n+=l.q}salvarCar();toast(n+(n>1?' itens':' item')+' no carrinho'+(fora?` · ${fora} esgotado${fora>1?'s':''}`:''));aba='carrinho';render();window.scrollTo(0,0)})}catch(e){c.innerHTML=`<p class="vazio" style="padding:20px">${esc(e.message)}</p>`}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'){pararCam();return}if(!me)return;if(emPix){clearTimeout(pixLoop);pixPasso&&pixPasso();return}carregarPend().then(()=>{if(!emPix)nav()});if(aba==='pendentes')telaPend();checarStatus()});
// contingência: o app pergunta a cada 20 s se o caixa da loja caiu ou voltou
async function checarStatus(){if(!me||document.visibilityState!=='visible')return;try{const r=await api('status');const a=me.perm||{};me.perm=r.perm;
 if(a.contingencia===r.perm.contingencia&&a.compra===r.perm.compra&&a.pendente===r.perm.pendente)return;
 if(r.perm.contingencia&&!a.contingencia){navigator.vibrate?.([40,60,40]);toast('O caixa da loja está sem internet: a compra pelo celular foi liberada')}
 else if(!r.perm.contingencia&&a.contingencia)toast(r.perm.compra?'O caixa da loja voltou a funcionar':'O caixa da loja voltou. Finalize a compra no caixa.');
 if(!emPix&&!document.querySelector('.verde')){if(!r.perm.compra&&aba==='carrinho')aba='produtos';render()}}catch(e){}}
setInterval(checarStatus,20000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
})();
